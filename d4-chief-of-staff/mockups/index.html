<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';style-src 'unsafe-inline';script-src 'unsafe-inline';img-src 'self' file: data:;connect-src 'none';base-uri 'none';form-action 'none'"><title>Bridge · 幕僚長方向圖稿</title><style>
:root{color-scheme:dark;--bg:#171c19;--nav:#131815;--surface:#1e2420;--raised:#252d27;--line:#2b342e;--text:#e6ebe7;--muted:#a0aaa3;--green:#80c89e;--amber:#d3aa72;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Microsoft JhengHei",sans-serif;font-size:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,textarea{font:inherit;color:inherit}button{cursor:pointer;background:transparent;border:0;min-height:44px}button:hover:not(:disabled){background:#ffffff08}button:disabled{cursor:default;opacity:.48}button:focus-visible,textarea:focus-visible{outline:2px solid #9cddba;outline-offset:3px}a{color:var(--green)}.shell{height:100dvh;display:grid;grid-template-columns:320px 330px minmax(0,1fr);grid-template-rows:36px minmax(0,1fr);overflow:hidden}.appnav{grid-row:1/3;background:var(--nav);border-right:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:3px}.navrow{padding:10px 12px;color:var(--muted);display:flex;gap:12px}.navrow.active{background:#212823;color:var(--text);border-radius:8px}.workspace{margin-top:22px;padding:20px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:2.3}.workspace b{color:var(--text);font-weight:500}.navbottom{margin-top:auto;padding:10px 12px;color:var(--muted);font-size:12px}.topbar{grid-column:2/4;border-bottom:1px solid var(--line);padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-size:13px}.demo{font-size:11px;color:var(--muted)}.board{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}.pinned{margin:12px;padding:12px 14px;text-align:left;border:1px solid #398355;border-radius:8px;background:#202a23;flex:none}.pinned strong{display:block;font-size:18px;font-weight:600;letter-spacing:-.35px}.pinned small{display:block;color:var(--muted);font-size:12px;margin-top:6px}.boardhead{display:flex;align-items:baseline;justify-content:space-between;margin:12px 16px 9px;gap:8px}.boardhead h2{font-size:17px;line-height:1.5;margin:0;font-weight:600}.small{font-size:11px;line-height:1.6;color:var(--muted)}.boardlist{flex:1;min-height:0;overflow:auto;padding:0 12px 12px}.boardrow{width:100%;text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);display:block}.boardrow .status{display:inline-block;font-size:11px;line-height:1.6;color:var(--amber);margin-bottom:5px}.boardrow strong{display:block;font-size:13px;font-weight:500;line-height:1.65}.meta{font-size:11px;color:var(--muted);line-height:1.7;margin-top:5px;display:flex;justify-content:space-between;gap:8px}.statusrow .status{color:var(--muted)}.statusrow strong{font-size:13px}.boardrow.selected{border:1px solid #526a58;background:#222c25;border-radius:7px}.sourcegap{font-size:12px;line-height:1.7;color:var(--amber);padding:14px 8px}.boardfoot{padding:8px 18px 14px;color:var(--muted);font-size:11px;line-height:1.7}.main{display:flex;flex-direction:column;min-height:0;min-width:0}.mainhead{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);font-weight:600}.mainhead button{font-weight:400;font-size:12px;color:var(--muted);padding:0 6px}.back{padding:0!important;font-size:13px!important}.subhead{min-height:36px;flex:none;padding:8px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);gap:10px}.conversation{flex:1;min-height:0;overflow:auto;padding:26px 28px}.chatwidth{max-width:800px;margin:0 auto}.byline{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:7px}.dot{width:7px;height:7px;display:inline-block;background:var(--green);border-radius:50%}.stamp{font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:17px}.focus h1{font-size:24px;line-height:1.55;font-weight:550;letter-spacing:-.5px;margin:0 0 12px}.focus p{font-size:16px;line-height:1.9;margin:0 0 16px;color:#d4ddd6;max-width:650px}.targetlink{display:inline-flex;align-items:center;justify-content:space-between;gap:20px;min-height:48px;border:1px solid #4f7d5c;border-radius:9px;background:#24352a;color:#b7dfc5;padding:10px 14px;text-align:left;line-height:1.7;font-size:14px}.footnote{margin-top:13px;font-size:12px;line-height:1.7;color:var(--muted)}.notice{padding:11px 14px;border-left:2px solid #9c8254;background:#24271f;color:#d6c9ac;font-size:13px;line-height:1.8;margin-bottom:24px}.notice.good{color:#bacdbf;border-left-color:#587c61;background:#1e2921}.old{opacity:.7}.quiet{color:var(--muted);font-size:14px;line-height:1.9}.userrow{display:flex;justify-content:flex-end;margin:24px 0}.bubble{max-width:82%;background:var(--raised);border-radius:14px;padding:11px 15px;line-height:1.7}.answer{font-size:15px;line-height:1.9;margin:0 0 12px}.composerwrap{padding:14px 20px 20px;flex:none}.composer{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px 10px}.hint{font-size:11px;color:var(--muted);padding:0 2px 6px}.inputrow{display:flex;align-items:flex-end;gap:8px}.inputrow textarea{min-width:0;flex:1;min-height:48px;max-height:110px;resize:none;border:0;background:transparent;line-height:1.7;padding:8px 2px;outline:0}.inputrow textarea::placeholder{color:#909c93}.send{background:#294635;border-radius:50%;width:44px;height:44px;flex:none;color:#c7e3d1;font-size:21px}.detailbody{padding:24px 28px;flex:1;min-height:0;overflow:auto}.detailbody h1{font-size:22px;line-height:1.6;margin:12px 0}.detailbody h2{font-size:14px;margin:25px 0 10px}.detailbody p{line-height:1.85;color:#cbd4cd}.eyebrow{font-size:11px;color:var(--amber);margin-top:8px}.controls{flex:none;padding:16px 24px 20px;border-top:1px solid var(--line)}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.choice{border:1px solid #526357;border-radius:12px;padding:0 15px;font-size:13px}.choice.chosen{background:#304335;border-color:#81b793}.reason{display:block;width:100%;height:62px;background:#141b16;border:1px solid #4d6153;border-radius:8px;padding:10px;resize:none;margin:12px 0}.confirm{border:1px solid #639574;border-radius:8px;padding:0 12px;background:#2a4432}.phoneback{display:none}.recheck{font-size:12px;border-bottom:1px solid #687c6d;color:var(--green);padding:0}.readnote{font-size:11px;color:var(--muted);line-height:1.7}.statusdetail{line-height:1.9;font-size:15px}.linkquiet{color:var(--green);padding:0}
@media(max-width:759px){.shell{display:flex;flex-direction:column}.appnav{display:none}.topbar{min-height:54px;flex:none;padding:0 16px;font-size:15px}.topbar .demo{font-size:10px}.board{display:none;flex:1;border-right:0;min-height:0}.shell.showboard .board{display:flex}.shell.showboard .main{display:none}.pinned{display:none}.phoneback{display:block;text-align:left;flex:none;padding:0 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}.boardhead{margin:15px 16px 9px}.boardrow{padding:10px 8px}.boardfoot{padding-bottom:12px}.main{flex:1;min-height:0}.mainhead{padding:0 12px;height:48px}.subhead{padding:7px 12px;font-size:11px;line-height:1.6}.conversation{padding:22px 16px}.focus h1{font-size:21px;line-height:1.55;margin-bottom:12px;letter-spacing:-.3px}.focus p{font-size:15px;line-height:1.9}.targetlink{width:100%;padding:10px 12px;gap:8px;font-size:13px}.stamp{font-size:11px;margin-bottom:16px}.notice{padding:10px 12px;font-size:12px;line-height:1.8;margin-bottom:20px}.composerwrap{padding:10px 12px 12px}.composer{padding:8px 11px 9px}.inputrow textarea{font-size:14px}.detailbody{padding:18px 16px}.detailbody h1{font-size:20px}.detailbody p{font-size:14px}.controls{padding:12px 16px 16px}.bubble{font-size:14px}.answer{font-size:14px}.readnote{font-size:11px}.boardrow strong{font-size:13px}}
</style></head><body><div id="root"></div><script id="scenarios" type="application/json">[{"id": "entry", "title": "進來，先做這一件", "note": "一則幕僚長開場：具名關卡、範例 FO 甲等候 42 分鐘、開目標。Board 新在上，推薦較舊等待；沒有代替批准。"}, {"id": "unchanged", "title": "重開，沒有變化", "note": "14:35 重新檢查，沿用同一則 14:20 建議，不新增聊天行。掃描版本來自既有對話；零新增自動掃描是設計要求，非此靜態圖稿量測。"}, {"id": "empty", "title": "目前沒有待你處理的事", "note": "必要來源已齊，沒有候選。完整 FO 狀態仍可看，不把無回報或失敗誤當零待辦。"}, {"id": "partial", "title": "來源不全，只給暫定焦點", "note": "只依已確認關卡及 FO 事項建議，審查來源未知；不聲稱全板最高優先。"}, {"id": "failed", "title": "掃描失敗，保留舊內容", "note": "本輪未完成，保留 13:40 舊建議並標未確認；沒有自動重試，也不讓舊目標繼續當成已確認可處理。"}, {"id": "stale", "title": "建議之後又有變更", "note": "對話仍在，標示 14:20 之後狀態已變；不悄悄改建議、不立即再掃。"}, {"id": "history", "title": "找不到上次掃描紀錄", "note": "重開但歷史未完整讀回，不能當首掃；只說無法確認，保留 Board 入口，不新增模型回合。"}, {"id": "target", "title": "開她指的具名關卡", "note": "先讀完整關卡，選擇與確認分開。固定返回；此頁沒有替艦長選准。"}, {"id": "returned", "title": "從目標回到幕僚長", "note": "同一建議、同一對話與原草稿保留。若 Board 未變，不另加一段開場。"}, {"id": "discussion", "title": "接著問一句", "note": "簡短追問及依已確認等待事實的回覆；仍是對話，沒有催問 FO 或自動轉達。"}, {"id": "board", "title": "Board：全部新在上", "note": "問題、FO 狀態、審查、權限、FO 狀態、關卡依來源時間混排；狀態列不算待辦。手機先按 Board，固定返回幕僚長。"}]</script><script>
const scenarios=JSON.parse(document.querySelector('#scenarios').textContent);let state='entry',view='chief',draft='',choice='',reason='',sent=false;const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const facts=[{id:'ask',time:'14:18',kind:'問題',status:'◆ 待你回覆',title:'範例資料匯入，日期用哪種格式？',fo:'範例 FO 乙'},{id:'idle',time:'14:12',kind:'狀態',status:'○ 閒置 · 0 件待辦',title:'範例 FO 丙',fo:'沒有待你處理的事項'},{id:'review',time:'14:05',kind:'審查',status:'◆ 審查請求',title:'範例匯出變更的審查請求',fo:'等待歸屬未知'},{id:'permission',time:'14:00',kind:'權限',status:'◆ 待你處理權限',title:'範例環境檢查需要工具權限',fo:'範例 FO 丁'},{id:'busy',time:'13:56',kind:'狀態',status:'◷ 執行中 · 0 件待辦',title:'範例 FO 戊',fo:'未提出待你處理的事項'},{id:'gate',time:'13:38',kind:'關卡',status:'◆ 待你決定',title:'範例試用，是否開始？',fo:'範例 FO 甲'}];
function board(){let rows=state==='empty'?facts.filter(x=>x.kind==='狀態'):facts.filter(x=>!(state==='partial'&&x.id==='review'));return `<aside class="board"><button class="phoneback" data-act="home">← 幕僚長</button><button class="pinned" data-act="home"><strong>◉ 幕僚長</strong><small>Chief of staff · 對齊眼前焦點</small></button><div class="boardhead"><h2>Board · ${state==='empty'?'0':state==='partial'?'3+':'4'}</h2><span class="small">最新在上</span></div><div class="boardlist">${rows.map(x=>`<button class="boardrow ${x.kind==='狀態'?'statusrow':''} ${view==='target'&&x.id==='gate'?'selected':''}" data-item="${x.id}" data-time="${x.time}" data-kind="${x.kind}"><span class="status">${state==='stale'&&x.id==='gate'?'◷ 已送出 · 等待轉送':x.status}</span><strong>${x.title}</strong><span class="meta"><span>${x.fo} · ${x.kind}</span><time>${x.time}</time></span></button>`).join('')}${state==='partial'?'<div class="sourcegap">! 審查來源未能確認<br>清單可能不完整。</div>':''}</div><div class="boardfoot">${state==='empty'?'來源已確認 · 沒有待你處理的事項':'時間為事項來源時間 · 狀態列不算待辦'}<br>14:20 檢查 · 全部資料虛構</div></aside>`}
function focus(){const unknown=['failed','stale'].includes(state);return `<div class="focus ${unknown?'old':''}" data-focus><div class="byline"><i class="dot"></i>幕僚長</div><div class="stamp">${state==='failed'?'13:40':'14:20'} · ${unknown?'上次建議':'已查看 Board'}</div><h1>${state==='partial'?'先看已確認的「範例試用」關卡。':'先看「範例試用」關卡。'}</h1><p>範例 FO 甲的這個關卡等你 ${state==='failed'?'2':'42'} 分鐘。<br>開關卡閱讀後，再決定是否開始。</p><button class="targetlink" data-act="target" ${unknown?'disabled':''}>${unknown?'關卡目前狀態待確認':'開啟「範例試用」關卡'} <span>↗</span></button></div>`}
function chat(){let body='';if(state==='unchanged'||state==='returned')body+='<div class="notice good">14:35 已檢查，沒有變化。沿用 14:20 的建議。</div>';if(state==='partial')body+='<div class="notice">審查來源未能讀取；以下只依已確認事項，不代表全部工作。</div>';if(state==='failed')body+='<div class="notice">14:20 掃描未能完成。保留上次建議，目前不能確認是否仍適用。</div>';if(state==='stale')body+='<div class="notice">14:22 之後已有變更。下方是 14:20 的舊建議，目前不能沿用為最新焦點。</div>';if(state==='history')body+='<div class="byline"><i class="dot"></i>幕僚長</div><h1 style="font-size:21px;line-height:1.6">暫時無法確認最新焦點。</h1><p class="quiet">上次對話未能完整讀取。<br>先查看 Board，原對話仍保留。</p><button class="targetlink" data-act="board">查看 Board <span>→</span></button>';else if(state==='empty')body+='<div class="byline"><i class="dot"></i>幕僚長</div><div class="stamp">14:20 · 來源已確認</div><div class="focus"><h1>目前沒有可確認<br>需要你處理的事項。</h1><p>沒有開放關卡、待答問題或審查請求。<br>FO 的狀態仍可在 Board 查看。</p></div>';else body+=focus();if(['failed','history'].includes(state))body+='<p class="footnote">不自動重試；可稍後重讀來源。</p><button class="recheck" data-act="recheck">重讀來源</button>';if(state==='discussion')body+='<div class="userrow"><div class="bubble">為什麼先看這件？</div></div><div class="byline"><i class="dot"></i>幕僚長</div><p class="answer">這是目前已確認等你最久的一件。要不要批准，仍由你決定。</p>';if(sent)body+='<div class="userrow"><div class="bubble">'+esc(sent)+'</div></div>';return `<section class="main"><header class="mainhead"><span>幕僚長</span><button data-act="board">Board</button></header><div class="subhead"><span>Chief of staff · 閒置</span><span>${state==='unchanged'||state==='returned'?'14:35 已檢查':'先對齊一件事'}</span></div><div class="conversation"><div class="chatwidth">${body}</div></div><div class="composerwrap"><div class="composer"><div class="hint">↑ 傳給幕僚長</div><div class="inputrow"><textarea id="message" aria-label="傳給幕僚長的訊息" placeholder="說說你的方向，或繼續討論…">${esc(draft)}</textarea><button class="send" data-act="send" aria-label="送出虛構訊息" ${!draft.trim()?'disabled':''}>↑</button></div></div></div></section>`}
function target(){return `<section class="main"><header class="mainhead"><button class="back" data-act="home">← 幕僚長</button><span class="small">範例 FO 甲</span></header><div class="detailbody"><div class="eyebrow">待你決定 · 關卡</div><h1>範例試用，是否開始？</h1><div class="small">範例試用流程 · 驗證階段 · 13:38 提出</div><h2>這次要你決定</h2><p>範例流程已補上取消步驟。是否開始小範圍試用？</p><h2>範圍與限制</h2><p>只包含範例環境的三個步驟，不代表正式開放。若要求修改或暫緩，請說明原因。</p><button class="linkquiet" data-act="brief">閱讀完整簡報 ↗</button><p class="readnote">此處為虛構關卡內容；沒有真實送出或記錄。</p></div><div class="controls">${state==='stale'?'<div class="notice">已送出，正在等待轉送。不能再次確認。</div>':''}<div class="small">給範例 FO 甲的關卡決定</div><div class="choices">${['准','修改','暫緩'].map(x=>`<button class="choice ${choice===x?'chosen':''}" data-choice="${x}">${x}</button>`).join('')}</div>${choice&&choice!=='准'?'<textarea class="reason" id="reason" aria-label="修改或暫緩原因" placeholder="請說明原因">'+esc(reason)+'</textarea>':''}<button class="confirm" data-act="confirm" ${!choice||(choice!=='准'&&!reason.trim())?'disabled':''}>${choice?'確認'+choice:'選擇後，再確認'}</button></div></section>`}
function statusdetail(){return `<section class="main"><header class="mainhead"><button class="back" data-act="home">← 幕僚長</button><span class="small">FO 對話</span></header><div class="conversation"><div class="statusdetail">${esc(window.detailTitle||'範例 FO 狀態')}<p class="quiet">本頁僅示意開啟這位 FO 的對話。未建立代理或傳送訊息。</p></div></div></section>`}
function render(){document.querySelector('#root').innerHTML=`<div class="shell ${view==='board'?'showboard':''}"><nav class="appnav"><div class="navrow">＋ <span>New workspace</span></div><div class="navrow">◴ <span>History</span></div><div class="navrow">⌕ <span>Search</span></div><div class="navrow active">♧ <span>Bridge</span></div><div class="workspace">WORKSPACE<br><b>範例工作區</b><br>● main</div><div class="navbottom">⊞　◉　▤</div></nav><div class="topbar"><span>Bridge</span><span class="demo">離線圖稿 · 全部資料虛構</span></div>${board()}${view==='target'?target():view==='status'?statusdetail():chat()}</div>`;if(state==='stale'&&view==='target'){document.querySelectorAll('.choice,.confirm').forEach(b=>b.disabled=true)}document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{if(b.dataset.item==='gate')return act('target');window.detailTitle=facts.find(x=>x.id===b.dataset.item).title;view='status';render()});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=b.dataset.choice;render()});document.querySelector('#message')?.addEventListener('input',e=>{draft=e.target.value;document.querySelector('.send').disabled=!draft.trim()});document.querySelector('#reason')?.addEventListener('input',e=>{reason=e.target.value;document.querySelector('.confirm').disabled=choice!=='准'&&!reason.trim()})}
function act(a){if(a==='target'){view='target';render()}if(a==='home'){view='chief';render()}if(a==='board'){view='board';render()}if(a==='send'&&draft.trim()){sent=draft;draft='';render()}if(a==='recheck'){document.querySelector('.footnote').textContent='來源目前仍未能確認；保留原內容。'}if(a==='brief'){document.querySelector('.readnote').textContent='完整簡報示意：範圍僅為範例環境；沒有對外開放或真實資料。'}if(a==='confirm'){document.querySelector('.controls').innerHTML='<div class="notice">僅示意按下確認；沒有送出真實決定。</div>'}}
function setScenario(id){state=scenarios.some(x=>x.id===id)?id:'entry';view=state==='board'?'board':state==='target'?'target':'chief';draft=state==='returned'?'我先看這個關卡。':'';choice='';reason='';sent=false;render()}
window.mock={scenarios,setScenario,snapshot:()=>({state,view,draft,choice,reason,sent})};setScenario(new URLSearchParams(location.search).get('state')||'entry');
</script></body></html>
