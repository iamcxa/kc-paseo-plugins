.navrow{min-height:44px;text-align:left;align-items:center;width:100%;flex:none}.navrow.active{color:var(--text)}.count{margin-left:auto;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:12px;background:#323e35;color:#d6ddcf;font-size:12px;font-weight:650}.count.calling,.count.attended{background:#b64646;color:#fff}.count.unknown{background:#403b2a;color:#e6c590}.count.zero{background:transparent;color:var(--muted)}.count.pulse{animation:chief-call 850ms ease-in-out 3}@keyframes chief-call{0%,100%{transform:scale(1);box-shadow:0 0 0 0 #e0676744}50%{transform:scale(1.18);box-shadow:0 0 0 7px #e0676700}}.alertnote{font-size:12px;line-height:1.85;padding:14px 12px;margin-top:12px;border-top:1px solid var(--line);color:#d7b8b8}.alertnote b{display:block;font-weight:550;color:#ecd5d5}.alertnote.quietnote{color:var(--muted)}.alertnote.quietnote b{color:#c7d0c9}.navclose,.menu,.scrim{display:none}.topbar .topname{display:flex;align-items:center;gap:8px}.quietstate{padding:20px 0}.quietstate h1{font-size:23px;font-weight:550;line-height:1.6;margin:0 0 16px}.quietstate p{color:var(--muted);line-height:1.9;font-size:15px}.workingdoc{max-width:560px;padding-top:10px}.workingdoc h1{font-size:23px;line-height:1.6;font-weight:550}.workingdoc p{line-height:1.9;color:var(--muted)}.documentline{height:1px;background:var(--line);margin:25px 0}.subhead{min-height:40px}.mainhead{height:48px}.readnote{margin:10px 0 0}.targetlink{white-space:normal}.boardrow .meta>span{min-width:0}.navbottom{line-height:1.8}

</style></head><body><div id="root"></div><script id="scenarios" type="application/json">[{"id": "rest", "title": "平時：總數 4，尚未呼叫", "note": "14:20 最早關卡只等 4 分鐘，未滿正常門檻。側欄是普通總數 4；手機開宿主側欄查看。沒有新增幕僚長開場。"}, {"id": "board", "title": "Board：所有事項最新在上", "note": "14:20 問題、兩個 FO 狀態、審查、權限、關卡依時間混排。四件待辦，狀態不計；手機為完整單頁，固定返回幕僚長。"}, {"id": "analysis", "title": "過門檻，正在整理", "note": "14:22 最早等 6 分鐘、後續 3 件、加權 19.5 > 8，觸發本批分析。尚未得到可確認焦點，總數普通、沒有呼叫。模型過程只是圖稿。"}, {"id": "call", "title": "她找你：紅色、短跳動、短音註記", "note": "14:22 本批焦點已確認。紅色總數 4 跳動三次，短音只以文字註記，沒有播放。你可先在別處工作，不插入其他對話。"}, {"id": "exception", "title": "單一關卡等 31 分鐘，找一次", "note": "另組虛構資料：13:38 的一件關卡到 14:09 已等 31 分鐘，後續 0 件、分數 4，仍依艦長接受的 >30 分鐘例外找一次。總數 1，FO 狀態不計。"}, {"id": "focus", "title": "進入對話：一個具名焦點", "note": "按側欄 Bridge 數字進入，停止跳動。她只以本批已確認事實先談「範例試用」關卡，開具名目標；沒有代替批准。"}, {"id": "entered", "title": "進入後：停止跳動、總數保留", "note": "已進幕僚長，總數仍 4，保留紅色但不再跳動或重播。手機重新展開側欄供檢查；進入並不等於回應或解除待辦。"}, {"id": "target", "title": "開她指的具名關卡", "note": "先讀完整關卡，沒有預選。修改／暫緩須理由，再按確認。固定返回幕僚長，沒有真實送出。"}, {"id": "returned", "title": "回來：焦點及草稿都在", "note": "同批不再加開場，具名焦點及草稿保留。不因返回再分析、跳動或播音；這是前端示意，不是跨重開驗證。"}, {"id": "empty", "title": "沒有值得呼叫的事", "note": "必要來源已確認、沒有待辦，總數 0，安靜；FO 的忙碌與閒置仍在 Board。狀態文字不是新助理訊息。"}, {"id": "source", "title": "來源不全：總數 ?，不冒充完整", "note": "審查來源未知，已確認清單仍可看，總數顯示 ?，不標全板最高優先、不觸發呼叫。手機展開側欄供檢查；不把未知當 0。"}]</script><script>
const scenarios=JSON.parse(document.querySelector('#scenarios').textContent);let state='rest',view='chief',drawer=false,draft='',choice='',reason='',sent=false,attended=false;
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const facts=[{id:'ask',time:'14:19',kind:'問題',status:'◆ 待你回覆',title:'範例資料匯入，日期用哪種格式？',fo:'範例 FO 乙'},{id:'idle',time:'14:18:30',kind:'狀態',status:'○ 閒置 · 0 件待辦',title:'範例 FO 丙',fo:'沒有待你處理的事項'},{id:'review',time:'14:18',kind:'審查',status:'◆ 審查請求',title:'範例匯出變更的審查請求',fo:'等待歸屬未知'},{id:'permission',time:'14:17',kind:'權限',status:'◆ 待你處理權限',title:'範例環境檢查需要工具權限',fo:'範例 FO 丁'},{id:'busy',time:'14:16:30',kind:'狀態',status:'◷ 執行中 · 0 件待辦',title:'範例 FO 戊',fo:'未提出待你處理的事項'},{id:'gate',time:'14:16',kind:'關卡',status:'◆ 待你決定',title:'範例試用，是否開始？',fo:'範例 FO 甲'}];
function rows(){if(state==='exception')return [{...facts[4],time:'14:08'},{...facts[1],time:'14:05'},{...facts[5],time:'13:38'}];return state==='empty'?facts.filter(x=>x.kind==='狀態'):facts.filter(x=>!(state==='source'&&x.id==='review'))}
const total=()=>state==='empty'?'0':state==='source'?'?':state==='exception'?'1':'4';
const calling=()=>['call','exception'].includes(state)&&!attended;
const hasfocus=()=>['focus','entered','target','returned'].includes(state)||attended;
const now=()=>state==='exception'?'14:09':['rest','board','empty','source'].includes(state)?'14:20':'14:22';
function sidebar(){const n=total(),call=calling();let note=call?`<b>幕僚長想找你談一件事</b>${state==='exception'?'單一關卡已等 31 分鐘，這次找一次。':'這批事情已整理好。'}<br>按 Bridge 的數字進入對話。<br><br>圖稿註記：紅色跳動三次，短音一次；本檔不實播。`:hasfocus()?`<b>已進入幕僚長</b>跳動已停止，不再播音。<br>待辦仍有 ${n} 件，進入不等於回應。`:state==='source'?'<b>部分來源未確認</b>先保留 ?，不把未知當作零。':state==='empty'?'<b>目前無需呼叫</b>來源已齊，沒有待你處理的事項。':state==='analysis'?'<b>正在整理本批事項</b>還沒有可確認的討論焦點，先不呼叫。':'<b>平時只顯示總數</b>尚未呼叫，沒有聲音或跳動。';return `<nav class="appnav" aria-label="宿主導覽"><button class="navclose" data-act="close" aria-label="關閉側欄">×</button><div class="navrow">＋ <span>New workspace</span></div><div class="navrow">◴ <span>History</span></div><div class="navrow">⌕ <span>Search</span></div><button class="navrow active" data-act="enter" aria-label="Bridge，待辦 ${n}，進入幕僚長">♧ <span>Bridge</span><span class="count ${call?'calling pulse':hasfocus()?'attended':state==='source'?'unknown':state==='empty'?'zero':''}" aria-label="未結束待辦總數">${n}</span></button><div class="workspace">WORKSPACE<br><b>範例工作區</b><br>● main</div><div class="alertnote ${call?'':'quietnote'}">${note}</div><div class="navbottom">${now()} · 全部資料虛構<br>⊞　◉　▤</div></nav><button class="scrim" data-act="close" aria-label="關閉側欄遮罩"></button>`}
function board(){return `<aside class="board"><button class="phoneback" data-act="home">← 幕僚長</button><button class="pinned" data-act="home"><strong>◉ 幕僚長</strong><small>Chief of staff · 對齊眼前焦點</small></button><div class="boardhead"><h2>Board · ${total()}</h2><span class="small">最新在上</span></div><div class="boardlist">${rows().map(x=>`<button class="boardrow ${x.kind==='狀態'?'statusrow':''} ${view==='target'&&x.id==='gate'?'selected':''}" data-item="${x.id}" data-time="${x.time}" data-kind="${x.kind}"><span class="status">${x.status}</span><strong>${x.title}</strong><span class="meta"><span>${x.fo} · ${x.kind}</span><time>${x.time}</time></span></button>`).join('')}${state==='source'?'<div class="sourcegap">! 審查來源未能確認<br>清單可能不完整；總數暫為 ?。</div>':''}</div><div class="boardfoot">${state==='empty'?'來源已確認 · 沒有待你處理的事項':'事項來源時間 · FO 狀態不算待辦'}<br>${now()} 檢查 · 全部資料虛構</div></aside>`}
function focus(){return `<div class="focus" data-focus><div class="byline"><i class="dot"></i>幕僚長</div><div class="stamp">${now()} · 這批待辦已整理</div><h1>先看「範例試用」關卡。</h1><p>範例 FO 甲的這個關卡等你 ${state==='exception'?'31':'6'} 分鐘。<br>先讀範圍，再一起決定是否開始。</p><button class="targetlink" data-act="target">開啟「範例試用」關卡 <span>↗</span></button></div>`}
function chat(){let body='';if(hasfocus()){if(state==='returned')body+='<div class="notice good">回到同一個焦點。草稿仍在，沒有新增開場。</div>';body+=focus()}else if(calling())body='<div class="workingdoc"><span class="small">範例工作對話</span><h1>繼續眼前的工作</h1><p>這裡示意你正在另一段對話。<br>幕僚長從側欄找你，不插入本段內容。</p><div class="documentline"></div><p>待你有空，按側欄紅色數字回她的對話。</p></div>';else{const title=state==='empty'?'目前沒有需要你處理的事項。':state==='source'?'部分來源尚未確認。':state==='analysis'?'正在整理這批待辦。':'還不用分心看這裡。';const text=state==='empty'?'必要來源已確認。FO 狀態仍可在 Board 查看。':state==='source'?'已確認的事項仍在 Board。審查來源未知，先不宣稱總數或全板優先。':state==='analysis'?'累積已達門檻。等焦點核對完成，她才會找你。':'待辦已累積 4 件，最早一件只等 4 分鐘。等事情值得談，她會從側欄找你。';body=`<div class="quietstate" data-quiet><div class="stamp">${now()} · 狀態</div><h1>${title}</h1><p>${text}</p><p class="readnote">這是介面狀態，沒有新增助理訊息。</p></div>`}if(sent)body+='<div class="userrow"><div class="bubble">'+esc(sent)+'</div></div>';return `<section class="main"><header class="mainhead"><span>${calling()?'範例工作對話':'幕僚長'}</span><button data-act="board">Board</button></header><div class="subhead"><span>${calling()?'對話 · 工作中':state==='analysis'?'Chief of staff · 整理中':'Chief of staff'}</span><span>${hasfocus()?'同一批 · 不重播':calling()?'由側欄進入幕僚長':state==='source'?'來源未齊':'目前狀態'}</span></div><div class="conversation"><div class="chatwidth">${body}</div></div><div class="composerwrap"><div class="composer"><div class="hint">↑ ${calling()?'傳給目前對話':'傳給幕僚長'}</div><div class="inputrow"><textarea id="message" aria-label="對話草稿" placeholder="${calling()?'繼續眼前對話…':'說說你的方向，或繼續討論…'}">${esc(draft)}</textarea><button class="send" data-act="send" aria-label="送出虛構訊息" ${!draft.trim()?'disabled':''}>↑</button></div></div></div></section>`}
function target(){return `<section class="main"><header class="mainhead"><button class="back" data-act="home">← 幕僚長</button><span class="small">範例 FO 甲</span></header><div class="detailbody"><div class="eyebrow">待你決定 · 關卡</div><h1>範例試用，是否開始？</h1><div class="small">範例試用流程 · 驗證階段 · ${state==='exception'?'13:38':'14:16'} 提出</div><h2>這次要你決定</h2><p>範例流程已補上取消步驟。是否開始小範圍試用？</p><h2>範圍與限制</h2><p>只包含範例環境的三個步驟，不代表正式開放。若要求修改或暫緩，請說明原因。</p><button class="linkquiet" data-act="brief">閱讀完整簡報 ↗</button><p class="readnote">此處為虛構關卡內容；沒有真實送出或記錄。</p></div><div class="controls">${state==='stale'?'<div class="notice">已送出，正在等待轉送。不能再次確認。</div>':''}<div class="small">給範例 FO 甲的關卡決定</div><div class="choices">${['准','修改','暫緩'].map(x=>`<button class="choice ${choice===x?'chosen':''}" data-choice="${x}">${x}</button>`).join('')}</div>${choice&&choice!=='准'?'<textarea class="reason" id="reason" aria-label="修改或暫緩原因" placeholder="請說明原因">'+esc(reason)+'</textarea>':''}<button class="confirm" data-act="confirm" ${!choice||(choice!=='准'&&!reason.trim())?'disabled':''}>${choice?'確認'+choice:'選擇後，再確認'}</button></div></section>`}

function statusdetail(){return `<section class="main"><header class="mainhead"><button class="back" data-act="home">← 幕僚長</button><span class="small">FO 對話</span></header><div class="conversation"><div class="statusdetail">${esc(window.detailTitle||'範例 FO 狀態')}<p class="quiet">本頁僅示意具名對話。未建立代理或傳送訊息。</p></div></div></section>`}
function render(){document.querySelector('#root').innerHTML=`<div class="shell ${view==='board'?'showboard':''} ${drawer?'drawer':''}">${sidebar()}<div class="topbar"><span class="topname"><button class="menu" data-act="menu" aria-label="展開宿主側欄">☰</button>Bridge</span><span class="demo">離線圖稿 · 全部資料虛構</span></div>${board()}${view==='target'?target():view==='status'?statusdetail():chat()}</div>`;document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{if(b.dataset.item==='gate')return act('target');window.detailTitle=rows().find(x=>x.id===b.dataset.item).title;view='status';render()});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=b.dataset.choice;render()});document.querySelector('#message')?.addEventListener('input',e=>{draft=e.target.value;document.querySelector('.send').disabled=!draft.trim()});document.querySelector('#reason')?.addEventListener('input',e=>{reason=e.target.value;document.querySelector('.confirm').disabled=choice!=='准'&&!reason.trim()})}
function act(a){if(a==='target'){view='target';drawer=false;render()}if(a==='home'){view='chief';drawer=false;render()}if(a==='enter'){attended=hasfocus()||calling();view='chief';drawer=false;render()}if(a==='menu'){drawer=true;render()}if(a==='close'){drawer=false;render()}if(a==='board'){view='board';drawer=false;render()}if(a==='send'&&draft.trim()){sent=draft;draft='';render()}if(a==='brief')document.querySelector('.readnote').textContent='完整簡報示意：僅含範例環境，沒有真實資料。';if(a==='confirm')document.querySelector('.controls').innerHTML='<div class="notice">僅示意按下確認；沒有送出真實決定。</div>'}
function setScenario(id){state=scenarios.some(x=>x.id===id)?id:'rest';view=state==='board'?'board':state==='target'?'target':'chief';drawer=['rest','call','exception','entered','source'].includes(state);draft=state==='returned'?'我先看這個關卡。':'';choice='';reason='';sent=false;attended=false;render()}
window.mock={scenarios,setScenario,snapshot:()=>({state,view,drawer,draft,choice,reason,sent,total:total(),calling:calling(),hasfocus:hasfocus()})};setScenario(new URLSearchParams(location.search).get('state')||'rest');
</script></body></html>
