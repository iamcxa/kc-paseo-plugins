<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';style-src 'unsafe-inline';script-src 'unsafe-inline';img-src 'self' file: data:;connect-src 'none';base-uri 'none';form-action 'none'"><title>幕僚長 · 方向審查</title><style>:root{color-scheme:dark;background:#111613;color:#e3ebe5;font:14px -apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif}*{box-sizing:border-box}body{margin:0}header{padding:20px 24px;border-bottom:1px solid #354139}small{color:#a9b9af;font-size:12px}h1{font-size:19px;font-weight:550;line-height:1.7;margin:8px 0 0}main{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 130px)}nav{padding:16px 12px;border-right:1px solid #354139}button,select{font:inherit;min-height:44px;color:inherit;background:#202923;border:1px solid #3a4d40;border-radius:7px;padding:8px 12px;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #a9dcbb;outline-offset:2px}nav button{display:block;width:100%;text-align:left;font-size:12px;margin-bottom:6px;line-height:1.7}button[aria-pressed=true]{background:#2a3c30;border-color:#76a483}.content{padding:18px 22px;min-width:0}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tools span{margin-right:auto;color:#b4c2b9;font-size:12px}p{color:#b5c3ba;font-size:13px;line-height:1.9;max-width:1100px}.frames{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,.42fr);gap:18px;align-items:start}.frames.desktop{grid-template-columns:1fr}.frames.desktop .phone{display:none}.frames.phone{display:block}.frames.phone .desk{display:none}.frames.phone .phone{max-width:360px;margin:auto}figure{margin:0;min-width:0}figcaption{font-size:12px;color:#9caf9f;margin:0 0 10px}img{display:block;max-width:100%;height:auto;border:1px solid #3c4b41;border-radius:9px}a{color:#c0dec9}.footer{font-size:11px;color:#91a297;margin-top:20px}@media(max-width:700px){header{padding:16px}h1{font-size:16px}main{display:block}nav{display:flex;gap:5px;overflow:auto;border-bottom:1px solid #354139;border-right:0}nav button{flex:none;width:auto;margin:0}.content{padding:14px}.frames{display:block}.frames .desk{margin-bottom:18px}}</style></head><body><header><small>單一方向 · 離線圖稿 · 全部資料虛構</small><h1>事情累積後由她找你，再進對話談一件，這樣合用嗎？</h1><p>已定：X＝3、Y＝8、原權重，另加單一關卡／權限超過 30 分鐘找一次。</p></header><main><nav id="states" aria-label="圖稿狀態"></nav><section class="content"><div class="tools"><span id="position"></span><button data-mode="both" aria-pressed="true">桌面＋手機</button><button data-mode="desktop" aria-pressed="false">1440 桌面</button><button data-mode="phone" aria-pressed="false">360 手機</button><button id="prev" aria-label="上一個狀態">←</button><button id="next" aria-label="下一個狀態">→</button></div><p id="note"></p><div class="frames"><figure class="desk"><figcaption>1440 × 1000 · 點圖看原尺寸</figcaption><a id="desktop-link"><img id="desktop" alt="桌面圖稿"></a></figure><figure class="phone"><figcaption>360 × 780 · 點圖看原尺寸</figcaption><a id="phone-link"><img id="phone" alt="手機圖稿"></a></figure></div><p class="footer">左右方向鍵換狀態。這是靜態示意，未連接代理、未傳訊或記錄決定；音效只作註記；不證明背景計時、模型、通知、跨重開或實體手機行為。</p></section></main><script id="review-scenarios" type="application/json">[{"id": "rest", "title": "平時：總數 4，尚未呼叫", "note": "14:20 最早關卡只等 4 分鐘，未滿正常門檻。側欄是普通總數 4；手機開宿主側欄查看。沒有新增幕僚長開場。"}, {"id": "board", "title": "Board：所有事項最新在上", "note": "14:20 問題、兩個 FO 狀態、審查、權限、關卡依時間混排。四件待辦，狀態不計；手機為完整單頁，固定返回幕僚長。"}, {"id": "analysis", "title": "過門檻，正在整理", "note": "14:22 最早等 6 分鐘、後續 3 件、加權 19.5 > 8，觸發本批分析。尚未得到可確認焦點，總數普通、沒有呼叫。模型過程只是圖稿。"}, {"id": "call", "title": "她找你：紅色、短跳動、短音註記", "note": "14:22 本批焦點已確認。紅色總數 4 跳動三次，短音只以文字註記，沒有播放。你可先在別處工作，不插入其他對話。"}, {"id": "exception", "title": "單一關卡等 31 分鐘，找一次", "note": "另組虛構資料：13:38 的一件關卡到 14:09 已等 31 分鐘，後續 0 件、分數 4，仍依艦長接受的 >30 分鐘例外找一次。總數 1，FO 狀態不計。"}, {"id": "focus", "title": "進入對話：一個具名焦點", "note": "按側欄 Bridge 數字進入，停止跳動。她只以本批已確認事實先談「範例試用」關卡，開具名目標；沒有代替批准。"}, {"id": "entered", "title": "進入後：停止跳動、總數保留", "note": "已進幕僚長，總數仍 4，保留紅色但不再跳動或重播。手機重新展開側欄供檢查；進入並不等於回應或解除待辦。"}, {"id": "target", "title": "開她指的具名關卡", "note": "先讀完整關卡，沒有預選。修改／暫緩須理由，再按確認。固定返回幕僚長，沒有真實送出。"}, {"id": "returned", "title": "回來：焦點及草稿都在", "note": "同批不再加開場，具名焦點及草稿保留。不因返回再分析、跳動或播音；這是前端示意，不是跨重開驗證。"}, {"id": "empty", "title": "沒有值得呼叫的事", "note": "必要來源已確認、沒有待辦，總數 0，安靜；FO 的忙碌與閒置仍在 Board。狀態文字不是新助理訊息。"}, {"id": "source", "title": "來源不全：總數 ?，不冒充完整", "note": "審查來源未知，已確認清單仍可看，總數顯示 ?，不標全板最高優先、不觸發呼叫。手機展開側欄供檢查；不把未知當 0。"}]</script><script>const states=JSON.parse(document.querySelector('#review-scenarios').textContent);let current=0;document.querySelector('#states').innerHTML=states.map((s,i)=>'<button data-state="'+i+'" aria-pressed="false">'+String(i+1).padStart(2,'0')+'　'+s.title+'</button>').join('');function show(i){current=(i+states.length)%states.length;const s=states[current];document.querySelector('#note').textContent=s.note;document.querySelector('#position').textContent=(current+1)+' / '+states.length+' · '+s.title;for(const [width,id] of [[1440,'desktop'],[360,'phone']]){const src='screenshots/'+width+'-'+s.id+'.png';document.querySelector('#'+id).src=src;document.querySelector('#'+id).alt=s.title+' · '+width;document.querySelector('#'+id+'-link').href=src}document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.state)===current))}document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>show(Number(b.dataset.state)));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelector('.frames').className='frames '+b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b))});document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}});window.review={show,get current(){return states[current].id}};show(0);</script></body></html>
