<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';style-src 'unsafe-inline';script-src 'unsafe-inline';img-src 'self' file: data:;connect-src 'none';base-uri 'none';form-action 'none'"><title>幕僚長 · 方向審查</title><style>:root{color-scheme:dark;background:#111613;color:#e3ebe5;font:14px -apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif}*{box-sizing:border-box}body{margin:0}header{padding:20px 24px;border-bottom:1px solid #354139}small{color:#a9b9af;font-size:12px}h1{font-size:19px;font-weight:550;line-height:1.7;margin:8px 0 0}main{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 130px)}nav{padding:16px 12px;border-right:1px solid #354139}button,select{font:inherit;min-height:44px;color:inherit;background:#202923;border:1px solid #3a4d40;border-radius:7px;padding:8px 12px;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #a9dcbb;outline-offset:2px}nav button{display:block;width:100%;text-align:left;font-size:12px;margin-bottom:6px;line-height:1.7}button[aria-pressed=true]{background:#2a3c30;border-color:#76a483}.content{padding:18px 22px;min-width:0}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tools span{margin-right:auto;color:#b4c2b9;font-size:12px}p{color:#b5c3ba;font-size:13px;line-height:1.9;max-width:1100px}.frames{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,.42fr);gap:18px;align-items:start}.frames.desktop{grid-template-columns:1fr}.frames.desktop .phone{display:none}.frames.phone{display:block}.frames.phone .desk{display:none}.frames.phone .phone{max-width:360px;margin:auto}figure{margin:0;min-width:0}figcaption{font-size:12px;color:#9caf9f;margin:0 0 10px}img{display:block;max-width:100%;height:auto;border:1px solid #3c4b41;border-radius:9px}a{color:#c0dec9}.footer{font-size:11px;color:#91a297;margin-top:20px}@media(max-width:700px){header{padding:16px}h1{font-size:16px}main{display:block}nav{display:flex;gap:5px;overflow:auto;border-bottom:1px solid #354139;border-right:0}nav button{flex:none;width:auto;margin:0}.content{padding:14px}.frames{display:block}.frames .desk{margin-bottom:18px}}</style></head><body><header><small>單一方向 · 離線圖稿 · 全部資料虛構</small><h1>採幕僚長進入時說一件、Board 統一最新在上，且不再保留分組、摘要與 Replay，照這個方向做可以嗎？</h1></header><main><nav id="states" aria-label="圖稿狀態"></nav><section class="content"><div class="tools"><span id="position"></span><button data-mode="both" aria-pressed="true">桌面＋手機</button><button data-mode="desktop" aria-pressed="false">1440 桌面</button><button data-mode="phone" aria-pressed="false">360 手機</button><button id="prev" aria-label="上一個狀態">←</button><button id="next" aria-label="下一個狀態">→</button></div><p id="note"></p><div class="frames"><figure class="desk"><figcaption>1440 × 1000 · 點圖看原尺寸</figcaption><a id="desktop-link"><img id="desktop" alt="桌面圖稿"></a></figure><figure class="phone"><figcaption>360 × 780 · 點圖看原尺寸</figcaption><a id="phone-link"><img id="phone" alt="手機圖稿"></a></figure></div><p class="footer">左右方向鍵換狀態。這是靜態示意，未連接代理、未傳訊或記錄決定；不證明模型掃描、真實重開、手機或鍵盤行為。</p></section></main><script id="review-scenarios" type="application/json">[{"id": "entry", "title": "進來，先做這一件", "note": "一則幕僚長開場：具名關卡、範例 FO 甲等候 42 分鐘、開目標。Board 新在上，推薦較舊等待；沒有代替批准。"}, {"id": "unchanged", "title": "重開，沒有變化", "note": "14:35 重新檢查，沿用同一則 14:20 建議，不新增聊天行。掃描版本來自既有對話；零新增自動掃描是設計要求，非此靜態圖稿量測。"}, {"id": "empty", "title": "目前沒有待你處理的事", "note": "必要來源已齊，沒有候選。完整 FO 狀態仍可看，不把無回報或失敗誤當零待辦。"}, {"id": "partial", "title": "來源不全，只給暫定焦點", "note": "只依已確認關卡及 FO 事項建議，審查來源未知；不聲稱全板最高優先。"}, {"id": "failed", "title": "掃描失敗，保留舊內容", "note": "本輪未完成，保留 13:40 舊建議並標未確認；沒有自動重試，也不讓舊目標繼續當成已確認可處理。"}, {"id": "stale", "title": "建議之後又有變更", "note": "對話仍在，標示 14:20 之後狀態已變；不悄悄改建議、不立即再掃。"}, {"id": "history", "title": "找不到上次掃描紀錄", "note": "重開但歷史未完整讀回，不能當首掃；只說無法確認，保留 Board 入口，不新增模型回合。"}, {"id": "target", "title": "開她指的具名關卡", "note": "先讀完整關卡，選擇與確認分開。固定返回；此頁沒有替艦長選准。"}, {"id": "returned", "title": "從目標回到幕僚長", "note": "同一建議、同一對話與原草稿保留。若 Board 未變，不另加一段開場。"}, {"id": "discussion", "title": "接著問一句", "note": "簡短追問及依已確認等待事實的回覆；仍是對話，沒有催問 FO 或自動轉達。"}, {"id": "board", "title": "Board：全部新在上", "note": "問題、FO 狀態、審查、權限、FO 狀態、關卡依來源時間混排；狀態列不算待辦。手機先按 Board，固定返回幕僚長。"}]</script><script>const states=JSON.parse(document.querySelector('#review-scenarios').textContent);let current=0;document.querySelector('#states').innerHTML=states.map((s,i)=>'<button data-state="'+i+'" aria-pressed="false">'+String(i+1).padStart(2,'0')+'　'+s.title+'</button>').join('');function show(i){current=(i+states.length)%states.length;const s=states[current];document.querySelector('#note').textContent=s.note;document.querySelector('#position').textContent=(current+1)+' / '+states.length+' · '+s.title;for(const [width,id] of [[1440,'desktop'],[360,'phone']]){const src='screenshots/'+width+'-'+s.id+'.png';document.querySelector('#'+id).src=src;document.querySelector('#'+id).alt=s.title+' · '+width;document.querySelector('#'+id+'-link').href=src}document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.state)===current))}document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>show(Number(b.dataset.state)));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelector('.frames').className='frames '+b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b))});document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}});window.review={show,get current(){return states[current].id}};show(0);</script></body></html>
