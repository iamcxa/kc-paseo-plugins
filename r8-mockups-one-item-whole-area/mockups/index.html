<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'">
<title>Bridge · One item uses the whole area</title>
<style>
:root{color-scheme:dark;--bg:#181c1a;--side:#131715;--box:#1e2320;--border:#2a302c;--text:#f0f2f0;--muted:#a0a7a2;--green:#66b97c;--amber:#d1a454}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a,textarea{font:inherit}button,a{touch-action:manipulation}a{color:var(--green);text-decoration:none}button{color:inherit;cursor:pointer;background:none;border:0}button:disabled{cursor:default;opacity:.4}a:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:3px}textarea:focus{outline:2px solid var(--green);outline-offset:1px}textarea{resize:none;color:var(--text);background:none;border:0;width:100%;line-height:1.4}textarea::placeholder{color:var(--muted);opacity:1}h1,h2,p{margin:0}h1{font-size:16px;font-weight:600;line-height:1.45}h2{font-size:14px;font-weight:600}.muted,.small{color:var(--muted);font-size:12px}.eyebrow{color:var(--green);font-size:11px;font-weight:600;letter-spacing:1px}.host{position:fixed;inset:0 auto 0 0;width:320px;background:var(--side);border-right:1px solid var(--border);padding:10px 8px;color:var(--muted)}.navrow{padding:6px 10px}.navrow.active{background:var(--box);border-radius:9px;color:var(--text)}.workspaces{border-top:1px solid var(--border);margin-top:8px;padding:12px 8px}.workspace{margin-top:20px}.hostfoot{position:absolute;bottom:12px;left:16px;right:16px;font-size:12px}.shell{margin-left:320px;height:100dvh;display:flex;flex-direction:column}.hostbar{height:36px;min-height:36px;border-bottom:1px solid var(--border);padding:6px 12px;display:flex;align-items:center;justify-content:space-between}.phone-back{display:none}.bridge{flex:1;min-height:0;display:flex;flex-direction:column}.toolbar{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 20px;border-bottom:1px solid var(--border)}.back{display:flex;align-items:center;min-height:44px;color:var(--muted);font-size:12px;min-width:70px}.briefing{padding:16px 20px 14px;border-bottom:1px solid var(--border)}.briefing h1{margin:5px 0}.meta{color:var(--muted);font-size:12px;margin-bottom:8px}.tag{border:1px solid #68736b;padding:0 4px;border-radius:3px;font-size:11px}.summary{max-width:900px}.briefing details{margin-top:8px;font-size:12px}.briefing summary{cursor:pointer;color:var(--green);list-style:none;min-height:24px}.full{padding-top:10px;color:var(--text);font-size:14px}.full p+p{margin-top:8px}.conversation{flex:1;min-height:100px;overflow:auto;display:flex;flex-direction:column}.scope{padding:13px 20px;display:flex;gap:16px;justify-content:space-between;color:var(--muted);font-size:12px}.scope span{flex:1}.transcript{padding:14px 20px;max-width:950px}.transcript p+p{margin-top:12px}.bubble{margin:12px 0 0 auto;padding:8px 12px;background:var(--box);border-radius:12px;max-width:80%;white-space:pre-wrap}.composer{padding:8px 20px 20px}.messagebox{border:1px solid var(--border);background:var(--box);border-radius:14px;overflow:hidden}.hint{padding:7px 14px 0;color:var(--muted);font-size:12px}.messagebox textarea{display:block;padding:10px 14px 4px;min-height:52px;height:52px}.actions{display:flex;align-items:flex-end;gap:10px;padding:0 8px 8px 12px}.decision-group{display:flex;align-items:center;flex-wrap:wrap;gap:8px;flex:1}.decision-label{font-size:12px;color:var(--muted)}.choices{display:flex;gap:8px}.control{min-height:32px;min-width:32px;border:1px solid var(--border);border-radius:11px;padding:4px 12px;font-size:13px;display:inline-flex;align-items:center;justify-content:center}.control.success{color:var(--green);border-color:var(--green)}.control.warning{color:var(--amber);border-color:var(--amber)}.control.hold{color:var(--muted);border-color:#829086}.control[aria-pressed=true]{background:#363a2e;box-shadow:inset 0 0 0 1px currentColor}.send{width:32px;height:32px;min-width:32px;padding:0;border-radius:50%;border:0;background:#2a312c;font-size:21px;color:var(--muted)}.send.ready{background:var(--green);color:#102417}.divider{height:18px;width:1px;background:var(--border);margin-bottom:7px}.reasonbox{padding:12px;margin-top:8px;border:1px solid var(--border);border-radius:14px}.reasonbox label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.reasonbox textarea{background:var(--box);border:1px solid var(--border);border-radius:8px;padding:10px;height:58px;display:block;margin-bottom:8px}.reason-actions{display:flex;gap:8px}.reason-actions .confirm:not(:disabled){border-color:var(--green)}.result{padding:16px 20px;border-bottom:1px solid var(--border)}.result h1{margin:4px 0 6px}.result p{margin-top:8px}.result-status{font-weight:600;color:var(--green)}.queue{padding:18px 20px;overflow:auto;flex:1}.queue-tabs{display:flex;gap:18px;margin:0 0 20px;color:var(--muted);font-size:13px}.queue-tabs span:first-child{color:var(--text);border-bottom:2px solid var(--green);padding-bottom:8px}.sectionlabel{color:var(--muted);font-size:12px;margin:18px 0 6px}.queue-row{display:block;color:var(--text);padding:16px 0;border-bottom:1px solid var(--border)}.queue-row h2{font-size:15px}.rowdetail{margin-top:5px;color:var(--muted);font-size:12px}.rowtop{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--green);margin-bottom:4px}.queue-note{margin-bottom:18px}.landing{max-width:1000px;margin:0 auto;padding:40px 24px}.landing h1{font-size:24px;margin-bottom:8px}.landing p{color:var(--muted);margin-bottom:24px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid var(--border);border-radius:12px;padding:18px;color:var(--text);background:var(--box)}.card small{display:block;color:var(--muted);margin-top:6px}.reviewnote{font-size:12px;margin-top:24px;color:var(--muted)}
@media(max-width:700px){body{font-size:14px}.host{display:none}.shell{margin-left:0}.hostbar{height:56px;min-height:56px;padding:0 20px;font-size:16px;justify-content:flex-start;gap:20px}.hostbar .close{display:none}.phone-back{display:inline;color:var(--muted)}.toolbar{padding:0 12px}.briefing{padding:10px 12px 12px}.briefing h1{font-size:15px;margin:5px 0}.briefing .meta{margin-bottom:6px}.briefing summary{min-height:28px;padding-top:5px}.scope{padding:12px;font-size:11px;gap:8px}.transcript{padding:8px 12px}.conversation{min-height:90px}.composer{padding:8px 12px 12px}.messagebox textarea{height:52px;min-height:52px}.actions{gap:8px;padding:0 8px 8px 12px}.decision-group{display:block}.decision-label{display:block;font-size:12px;margin-bottom:4px}.choices{gap:8px}.control{min-height:44px;min-width:44px;padding:6px 12px;border-radius:14px}.send{width:44px;height:44px;min-width:44px;border-radius:50%}.divider{margin-bottom:13px}.reasonbox{padding:10px 12px}.reasonbox textarea{height:60px;padding:9px}.reasonbox label{font-size:11px}.reason-actions{gap:8px}.result{padding:12px}.queue{padding:14px 12px}.queue-row{padding:15px 0}.queue-tabs{margin-bottom:16px}.landing{padding:24px 16px}.landing h1{font-size:21px}.cards{grid-template-columns:1fr}.scope .full-view{display:none}}
</style>
<div id="app"></div>
<script>
const states=[['list','清單'],['open','單件全區'],['reason-empty','已選要求修改・理由空白'],['reason-typed','已填理由'],['sent','已送出'],['relayed','已轉送'],['recorded','已記錄'],['back-list','回到清單'],['comms','通訊官問題']];
const allowed=new Set(states.map(s=>s[0]));
let state=new URLSearchParams(location.search).get('state')||'review';
if(!allowed.has(state))state='review';
let chosen=state.startsWith('reason-')?'要求修改':null;
let messageDraft='';
let reasonDraft=state==='reason-typed'?'Please add the missing rollback check.':'';
const app=document.getElementById('app');
const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const url=s=>'?state='+s;
function host(content){return `<aside class="host" aria-label="Paseo navigation"><div class="navrow">＋ New workspace</div><div class="navrow">◷ History</div><div class="navrow">⌕ Search</div><div class="navrow">◷ Schedules</div><div class="navrow active">♧ Bridge</div><div class="workspaces small">Workspaces<div class="workspace">▣ &nbsp; Sample workspace</div></div><div class="hostfoot">⊞ &nbsp; ◉ &nbsp; ▤</div></aside><main class="shell"><header class="hostbar"><span class="phone-back">←</span><span>Bridge</span><span class="muted close">×</span></header><div class="bridge">${content}</div></main>`}
function toolbar(){return `<nav class="toolbar" aria-label="Item navigation"><a class="back" href="${url(['sent','relayed','recorded'].includes(state)?'back-list':'list')}">← Queue</a></nav>`}
function queue(){const done=state==='back-list';return `<div class="queue"><div class="queue-tabs"><span>By decision</span><span>By FO</span></div><p class="small queue-note">Sources checked just now</p><h1>Questions</h1>${done?'':`<a class="queue-row" href="${url('open')}"><div class="rowtop"><span>GATE · VALIDATION</span><span>waiting 2h</span></div><h2>Approve the draft checklist?</h2><div class="rowdetail">Demo FO · Sample workspace · <span class="tag">Tab closed</span></div></a>`}<a class="queue-row" href="${url('comms')}"><div class="rowtop"><span>COMMS OFFICER</span><span>waiting 12m</span></div><h2>Which review window should we use?</h2><div class="rowdetail">Comms officer · idle</div></a></div>`}
function briefing(){return `<section class="briefing" aria-label="Gate briefing"><div class="eyebrow">GATE · VALIDATION · SAMPLE WORKSPACE</div><h1>Approve the draft checklist?</h1><div class="meta">Demo FO · <span class="tag">Tab closed</span> &nbsp; waiting 2h</div><p class="summary">The draft checklist is ready for review. Confirm the remaining checks before proceeding.</p><details><summary>Read full briefing ›</summary><div class="full"><p>Draft checklist: verify the preview, check the sample export, and agree on the review window.</p><p>The rollback check is still missing. This gate asks whether to accept the draft or request a revision before the review.</p></div></details></section>`}
function conversation(comms=false){return `<section class="conversation" aria-label="Conversation"><div class="scope"><span>Conversation with ${comms?'Comms officer':'Demo FO'} · includes other tasks</span><span class="full-view">Open full view</span></div><div class="transcript"><p>${comms?'Which review window should we use? (you)':'The draft is ready. Please confirm the remaining checks before the review. (you)'}</p><div id="sent-messages"></div></div></section>`}
function composer(comms=false,terminal=false){const who=comms?'Comms officer':'Demo FO';return `<section class="composer" aria-label="Message and decision"><div class="messagebox"><div class="hint">↑ sends to ${who}</div><textarea id="message" aria-label="Message ${who}" placeholder="Message ${who}${comms?'':' directly'}">${esc(messageDraft)}</textarea><div class="actions">${comms||terminal?'<div style="flex:1"></div>':`<div class="decision-group"><span class="decision-label">Decide via comms officer</span><div class="choices">${['准','要求修改','暫緩'].map((word,i)=>`<button class="control choice ${['success','warning','hold'][i]}" data-choice="${word}" aria-pressed="${chosen===word}">${word}</button>`).join('')}</div></div><span class="divider"></span>`}<button id="send" class="control send" aria-label="Send message to ${who}" disabled>↑</button></div></div>${chosen?reasonbox():''}</section>`}
function reasonbox(){const required=chosen!=='准';return `<div class="reasonbox"><label for="reason">Reason for ${chosen} (${required?'required':'optional'}) · via comms officer</label><textarea id="reason" placeholder="${required?'Add a reason for this decision':'Optional reason'}" ${required?'required':''}>${esc(reasonDraft)}</textarea><div class="reason-actions"><button id="confirm" class="control confirm" ${required&&!reasonDraft.trim()?'disabled':''}>Confirm ${chosen}</button><button id="cancel" class="control">Cancel</button></div></div>`}
function result(){const copy={sent:['Sent to comms officer','Waiting for the comms officer to relay your decision.'],relayed:['Relayed to Demo FO','Waiting for Demo FO to check your words and the briefing, then record the decision.'],recorded:['Recorded by Demo FO','Your decision has been recorded.']}[state];return `<section class="result" aria-label="Decision result"><div class="eyebrow">GATE · VALIDATION · SAMPLE WORKSPACE</div><h1>Approve the draft checklist?</h1><div class="meta">Demo FO · <span class="tag">Tab closed</span></div><p class="result-status">${copy[0]}</p><p>要求修改 — ${esc(reasonDraft||'Please add the missing rollback check.')}</p><p class="muted">${copy[1]}</p></section>`}
function render(){if(state==='review'){app.innerHTML=`<main class="landing"><div class="eyebrow">第 8 輪 · 靜態設計稿</div><h1>單件使用整個 Bridge 區域</h1><p>先從清單開一件；確認後留在原件看結果，再回清單。以下全部使用虛構資料。</p><div class="cards">${states.map(([s,title])=>`<a class="card" href="${url(s)}">${title}<small>開啟畫面 →</small></a>`).join('')}</div><div class="reviewnote">同一方向，桌面與手機共用版面規則。<br>這是離線示意；送出和確認只改變畫面，不會傳訊或記錄決定。<br>已送出、已轉送、已記錄是分開的固定示意頁，不會自動進度。<br><a href="REVIEW.md">逐頁審閱問題與 PNG</a> · <a href="ASSUMPTIONS.md">設計假設</a></div></main>`;return}
let content;if(['list','back-list'].includes(state))content=queue();else if(state==='comms')content=toolbar()+`<section class="briefing"><div class="eyebrow">COMMS OFFICER · WAITING 12M</div><h1>Which review window should we use?</h1></section>`+conversation(true)+composer(true);else if(['sent','relayed','recorded'].includes(state)){chosen=null;content=toolbar()+result()+conversation()+composer(false,true)}else content=toolbar()+briefing()+conversation()+composer();app.innerHTML=host(content);bind();}
function bind(){const message=document.getElementById('message');const send=document.getElementById('send');if(message&&send){send.disabled=!message.value.trim();send.classList.toggle('ready',!!message.value.trim())}message?.addEventListener('input',()=>{messageDraft=message.value;send.disabled=!messageDraft.trim();send.classList.toggle('ready',!!messageDraft.trim())});send?.addEventListener('click',()=>{if(!messageDraft.trim())return;const p=document.createElement('p');p.className='bubble';p.textContent=messageDraft;document.getElementById('sent-messages').append(p);message.value='';messageDraft='';send.disabled=true;send.classList.remove('ready')});document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{chosen=b.dataset.choice;render()}));document.getElementById('reason')?.addEventListener('input',e=>{reasonDraft=e.target.value;document.getElementById('confirm').disabled=chosen!=='准'&&!reasonDraft.trim()});document.getElementById('cancel')?.addEventListener('click',()=>{chosen=null;render()});document.getElementById('confirm')?.addEventListener('click',()=>{if(chosen!=='准'&&!reasonDraft.trim())return;const decision=chosen;state='sent';history.replaceState(null,'',url(state));render();document.querySelector('.result p:nth-of-type(2)').textContent=decision+(reasonDraft.trim()?' — '+reasonDraft:'');});}
render();
</script>
</html>
