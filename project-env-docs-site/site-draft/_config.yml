title: kc-paseo-plugins
description: Plugins for Paseo, with setup guides.
theme: minima
author: Kent

header_pages:
  - docs/project-env/index.md
  - docs/project-env/install.md
  - docs/project-env/prepare-1password.md
  - project-env/OVERVIEW.md
  - project-env/CHANGELOG.md

defaults:
  - scope: { path: "README.md" }
    values: { layout: default }
  - scope: { path: "project-env/OVERVIEW.md" }
    values: { title: "Reference" }
  - scope: { path: "project-env/CHANGELOG.md" }
    values: { title: "Changelog", layout: default }

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - docs/adr
  - docs/dev2
  - docs/dev2-poc
  - docs/journey
  - docs/project-env/capture
  - project-env/client
  - project-env/server
  - project-env/shared
  - project-env/test
  - project-env/index.client.tsx
  - project-env/index.server.ts
  - project-env/package.json
  - project-env/package-lock.json
  - project-env/paseo-plugin.json
  - project-env/tsconfig.json
  - spacedock-bridge
  - release-please-config.json
