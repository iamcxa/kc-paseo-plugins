<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';style-src 'unsafe-inline';script-src 'unsafe-inline';img-src 'self' file: data:;connect-src 'none';base-uri 'none';form-action 'none'"><title>幕僚長 · 原生對話設計審查</title><style>
:root{color-scheme:dark;font:14px -apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif;background:#111613;color:#e3ebe5}*{box-sizing:border-box}body{margin:0}header{padding:20px 24px 17px;border-bottom:1px solid #303c33}small{font-size:11px;color:#9eadA3}h1{font-size:20px;line-height:1.7;font-weight:550;margin:8px 0}p{font-size:12px;color:#adbbb1;line-height:1.85;margin:6px 0}.layout{display:grid;grid-template-columns:260px minmax(0,1fr)}nav{padding:14px;border-right:1px solid #303c33;max-height:calc(100dvh - 155px);overflow:auto}button,select{font:inherit;color:inherit;background:#1d2820;border:1px solid #3d5143;border-radius:8px;min-height:44px;cursor:pointer}button:hover{background:#293d30}button:focus-visible,select:focus-visible{outline:2px solid #a9dcbb;outline-offset:2px}.state{display:block;width:100%;text-align:left;line-height:1.65;padding:9px 11px;margin-bottom:6px;font-size:12px;background:transparent;border-color:transparent}.state.active{background:#253c2c;border-color:#60856a}.viewer{min-width:0;padding:14px 18px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar button{padding:0 14px}.toolbar .count{margin-left:auto;color:#9fb0a4;font-size:12px}.frames{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:20px;align-items:start;margin-top:18px}.frames figure{min-width:0;margin:0}.frames img{max-width:100%;height:auto;display:block;border:1px solid #384b3f;border-radius:9px}.frames figcaption{font-size:11px;color:#a3b7aa;line-height:1.9;margin-bottom:9px}.frames.phone{display:block}.frames.phone .desktopframe{display:none}.frames.phone .phoneframe{max-width:360px;margin:auto}.frames.desktop{display:block}.frames.desktop .phoneframe{display:none}.note{min-height:44px}.link{color:#b1d5bd;text-decoration:none;display:inline-flex;align-items:center;min-height:44px;margin-top:8px;font-size:12px}@media(max-width:759px){header{padding:14px 12px}h1{font-size:17px}.layout{display:block}nav{max-height:170px;border-right:0;border-bottom:1px solid #303c33;padding:10px 12px;display:flex;gap:7px;overflow:auto}.state{min-width:170px;max-width:200px;margin:0}.viewer{padding:12px}.frames{display:block}.desktopframe{display:none}.phoneframe{max-width:360px;margin:auto}.toolbar{gap:6px}.toolbar button{font-size:12px;padding:0 9px}.toolbar .count{font-size:11px}}</style></head><body><header><small>一個方向 · 原生對話 · 手機優先 · 全部內容虛構</small><h1>點推播後，直接在她的原生對話逐件處理，這樣合用嗎？</h1><p>入口 1 次＋原位 8 次；理由另加 2。元件不支援時走 Bridge 三次入口。這是離線圖稿，手機能力檢查尚未進行。</p></header><div class="layout"><nav id="states" aria-label="逐態圖稿"></nav><main class="viewer"><div class="toolbar"><button id="prev" aria-label="上一態">←</button><button id="next" aria-label="下一態">→</button><button data-mode="phone">360 手機</button><button data-mode="desktop">1440 桌面</button><button data-mode="both">並看</button><span class="count" id="counter"></span></div><p class="note" id="note"></p><div class="frames" id="frames"><figure class="phoneframe"><figcaption>360 × 780 · 主要審查</figcaption><img id="phone" alt="手機圖稿"></figure><figure class="desktopframe"><figcaption>1440 × 1000 · 相同方向的寬螢幕呈現</figcaption><img id="desktop" alt="桌面圖稿"></figure></div><a class="link" id="interactive" href="index.html">開啟這個狀態的離線操作示意 ↗</a><p>圖稿中的送達／記錄為虛構狀態，沒有傳訊、權限操作或正式關卡記錄。鍵盤是靜態示意。</p></main></div><script id="state-data" type="application/json">[{"id": "landing", "title": "推播落點：四件在她的原生對話", "note": "一行批次進度，直接接題目與送出；沒有 Bridge／Board 主畫面。"}, {"id": "question", "title": "問題原位回答", "note": "題目、範例 FO 乙與明示原文轉達相鄰。"}, {"id": "sent", "title": "問題：已送給幕僚長", "note": "她已收到這次原話，尚未查到 FO 收件；不顯示完成。"}, {"id": "relayed", "title": "問題：已轉達給 FO", "note": "同一次問題與原話已在具名 FO 收件，仍不等於工作結束。"}, {"id": "gate", "title": "關卡簡報與選擇", "note": "具名「範例試用」第1版，沒有預選；選擇本身不送。"}, {"id": "chosen", "title": "選准後，另按 Confirm", "note": "具名確認與可選條件分開，一般聊天不替代確認。"}, {"id": "reason", "title": "修改需要理由", "note": "要求修改已選，理由空白，具名 Confirm 停用。"}, {"id": "reason-typed", "title": "理由填好，具名 Confirm 可按", "note": "保留完整條件，取消仍留稿；沒有實際送出。"}, {"id": "gate-sent", "title": "關卡：已送給幕僚長，尚未轉達", "note": "同一個具名關卡、第1版、艦長原話；重複 Confirm 停用，尚無 FO 收件或記錄。"}, {"id": "gate-relayed", "title": "關卡：已轉達，等待記錄", "note": "同一次決定已到範例 FO 甲，還沒有同版關卡記錄；原話保留，不能重複確認。"}, {"id": "recorded", "title": "關卡：已記錄", "note": "同版簡報、這次決定編號與原話相符才呈現。"}, {"id": "permission", "title": "權限：到具名 FO 處理", "note": "另一組四件，權限替代第四件；沒有批准／拒絕。"}, {"id": "half", "title": "只答半批，其餘仍在", "note": "一題已轉達、一關卡已記錄收成可展開收據；兩件未答仍在，首屏可見送出。"}, {"id": "stale", "title": "關卡換版：拒絕舊確認", "note": "第1版草稿保留，第2版須重讀；沒有自動套用。"}, {"id": "unsupported", "title": "元件不支援：原訊息仍可讀", "note": "同批已送2／4、已記錄1；原訊息保留逐項狀態與側欄→Bridge 指引。"}, {"id": "fallback-menu", "title": "備援：開側欄找 Bridge", "note": "同一批、同樣逐項進度；開側欄本身不送出、不改狀態。"}, {"id": "fallback-bridge", "title": "備援：Bridge 的同一批", "note": "回到同批，仍已送2／4、已記錄1；只導覽，不重送，直接到未答題。"}, {"id": "keyboard", "title": "手機鍵盤升起", "note": "240 px 靜態鍵盤示意；題目、收件 FO、答案與送出在上方可見，非真機能力驗收。"}]</script><script>
const states=JSON.parse(document.querySelector('#state-data').textContent);let current=0;
document.querySelector('#states').innerHTML=states.map((s,i)=>'<button class="state" data-state="'+i+'">'+(i+1)+' · '+s.title+'</button>').join('');
function show(i){current=(i+states.length)%states.length;const s=states[current];document.querySelector('#phone').src='screenshots/360-'+s.id+'.png';document.querySelector('#desktop').src='screenshots/1440-'+s.id+'.png';document.querySelector('#phone').alt=s.title+'（手機）';document.querySelector('#desktop').alt=s.title+'（桌面）';document.querySelector('#note').textContent=s.note;document.querySelector('#counter').textContent=(current+1)+' / '+states.length;document.querySelector('#interactive').href='index.html?state='+s.id;document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('active',Number(b.dataset.state)===current))}
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>show(Number(b.dataset.state)));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>document.querySelector('#frames').className='frames '+(b.dataset.mode==='both'?'':b.dataset.mode));document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});window.review={show,get current(){return states[current].id}};show(0);
</script></body></html>
