</style></head><body><div id="app"></div><script>
const svg=(kind='arrow')=>'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+(kind==='menu'?'<path d="M5 6h14M5 12h14M5 18h14"/>':kind==='send'?'<path d="M12 19V5m-6 6 6-6 6 6"/>':'<path d="M5 12h14m-5-5 5 5-5 5"/>')+'</svg>';
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const items=[{id:'q1',kind:'問題',title:'日期要用哪一種格式？',fo:'範例 FO 乙',wait:'12 分鐘'},{id:'g1',kind:'關卡',title:'是否開始「範例試用」？',fo:'範例 FO 甲',wait:'18 分鐘'},{id:'q2',kind:'問題',title:'要保留舊的範例資料嗎？',fo:'範例 FO 丁',wait:'9 分鐘'},{id:'g2',kind:'關卡',title:'範例驗收是否先暫緩？',fo:'範例 FO 丙',wait:'7 分鐘'}];
let scene='landing',qstatus='',gstatus='',chosen='',reason='',qDraft='',ordinaryDraft='',stale=false,drawer=false,events=[],notice='',gateVersion=1,q2done=false,g2done=false,g2word='',g2reason='';
const isFallback=()=>scene==='fallback-bridge';
function overview(){return '<div class="overview" data-four-items>'+items.map((x,i)=>{const permission=scene==='permission'&&i===3;const status=x.id==='q1'&&qstatus==='relayed'?'已轉達':x.id==='q1'&&qstatus?'已送':x.id==='g1'&&gstatus?'已記錄':'未答';return '<div class="overview-row"><span class="kind">'+(permission?'權限':x.kind)+'</span><div>'+(permission?'範例環境檢查需要你處理':esc(x.title))+'<small>'+(permission?'範例 FO 戊':esc(x.fo))+' · 等 '+esc(x.wait)+' · <span class="'+(status!=='未答'?'inline-status':'')+'">'+status+'</span></small></div></div>'}).join('')+'</div>'}
function question(x){const answered=x.id==='q1'&&qstatus;return '<article class="item '+(answered?'muted':'')+'" id="'+x.id+'" data-item="'+x.id+'"><header><span class="tag">問題</span><span class="status '+(qstatus==='relayed'&&x.id==='q1'?'good':'')+'">'+(answered?(qstatus==='sent'?'已送給幕僚長':'已轉達給 '+x.fo):'待你回答')+'</span></header><h2>'+esc(x.title)+'</h2><div class="recipient" data-recipient>'+esc(x.fo)+' 正在等你 · 已等 '+esc(x.wait)+'</div>'+(answered?'<div class="quoted"><small>你 → 幕僚長 · 原文轉達給 '+x.fo+'</small>「'+esc(qDraft)+'」</div><div class="delivery '+(qstatus==='relayed'?'good':'')+'"><strong>'+(qstatus==='sent'?'已送給幕僚長':'已轉達給 '+x.fo)+'</strong><small>'+(qstatus==='sent'?'她已收到你的原話；尚未確認 FO 收件。':'已核對這個問題與原話的收件訊息；等待 FO 回應。')+'</small></div>':'<label class="answerlabel" for="answer-'+x.id+'">你的原話 · 只轉達這個問題</label><textarea class="answerinput" id="answer-'+x.id+'" data-question="'+x.id+'" placeholder="輸入要轉達給 '+x.fo+' 的答案…" aria-label="給'+x.fo+'的原文答案">'+(x.id==='q1'?esc(qDraft):'')+'</textarea><button class="send-answer" data-send="'+x.id+'" '+((x.id==='q1'?qDraft:'').trim()?'':'disabled')+'>原文轉達給 '+esc(x.fo)+svg('send')+'</button><p class="help">按下才會把這個問題與你的原話交給她轉達。</p>')+'</article>'}
function gate(x){if(x.id==='g2')return '<article class="item muted" id="g2" data-item="g2"><header><span class="tag">關卡</span><span class="status">待你決定</span></header><h2>'+esc(x.title)+'</h2><div class="recipient">'+x.fo+' 正在等你 · 已等 '+x.wait+'</div><p>等範例檢查齊全，再做正式驗收。</p><div class="version">範例驗收 · 簡報第 1 版</div><div class="choices" aria-label="範例驗收決定">'+['准','要求修改','暫緩'].map(w=>'<button class="choice" data-second-choice="'+w+'">'+w+'</button>').join('')+'</div><p class="help">選擇之後，還要確認這個具名關卡。</p></article>';
const recorded=Boolean(gstatus);return '<article class="item" id="g1" data-item="g1"><header><span class="tag">關卡 · 範例試用</span><span class="status '+(recorded?'good':'')+'">'+(recorded?'已記錄':stale?'版本已變更':'待你決定')+'</span></header><h2>'+esc(x.title)+'</h2><div class="recipient">'+x.fo+' 正在等你 · 已等 '+x.wait+'</div><div class="version">你正在看：簡報第 '+gateVersion+' 版</div><p class="brief">只在範例環境試用，先用一筆虛構資料；不影響現有資料。</p><details class="evidence"><summary>看依據與範圍</summary><div class="evidencecopy">範例檢查已完成。這次只決定是否開始試用，沒有正式發布或處理權限。</div></details>'+(recorded?'<div class="quoted"><small>你確認的原話</small>「'+esc(chosen+(reason?'，'+reason:''))+'」</div><div class="delivery good"><strong>已記錄：'+esc(chosen)+'</strong><small>範例 FO 甲已在同一版關卡記錄你的決定。</small></div><details class="evidence" '+(scene==='recorded'?'open':'')+'><summary>核對這次記錄</summary><div class="evidencecopy">簡報第 '+gateVersion+' 版 · 決定編號 demo-decision-01<br>記錄原文：'+esc(chosen+(reason?'，'+reason:''))+'<br>編號與你的原話相符；其他未答事項仍在。</div></details>':'<div class="choices" aria-label="範例試用決定">'+['准','要求修改','暫緩'].map(w=>'<button class="choice '+(chosen===w?'chosen':'')+'" data-choice="'+w+'" aria-pressed="'+(chosen===w)+'" '+(stale?'disabled':'')+'>'+w+'</button>').join('')+'</div>'+(chosen?'<div class="reasonbox"><label for="reason">'+esc(chosen)+'的理由'+(chosen==='准'?'（可選，也可寫條件）':'（必填）')+'</label><textarea class="reasoninput" id="reason" aria-label="'+esc(chosen)+'的理由" placeholder="'+(chosen==='准'?'有條件，請照你的原話寫下':'先寫理由，再按具名 Confirm')+'">'+esc(reason)+'</textarea><button class="confirm" data-confirm aria-label="Confirm '+esc(chosen)+' · 範例試用" '+(stale||chosen!=='准'&&!reason.trim()?'disabled':'')+'>Confirm '+esc(chosen)+' · 範例試用</button><button class="cancel" data-act="cancel">取消這次選擇</button></div>':'<p class="help">先選你的決定；沒有預選，也還沒送出。</p>')+(stale?'<div class="warn" role="status">簡報已從第 1 版更新成第 2 版。<br>這次沒有送出；你的原稿仍保留。</div><button class="read-new" data-act="read-new">讀取新版簡報'+svg()+'</button>':''))+'</article>'}
function permission(){return '<article class="item permission-card" id="permission" data-item="permission"><header><span class="tag">權限</span><span class="status">待你到 FO 處理</span></header><h2>範例環境檢查需要你處理權限</h2><div class="recipient">範例 FO 戊 正在等你 · 已等 7 分鐘</div><p>這件要由你在他的原生對話裡處理。她不能替你批准，也不能替你拒絕。</p><button class="go-fo" data-act="permission">到範例 FO 戊處理'+svg()+'</button><p class="help">經現有 Bridge 具名入口，開他的原生對話。處理完，再回幕僚長；此處不會直接操作權限。</p></article>'}
function unsupported(){return '<div class="original" data-original><small>工作事項整理 · 自動訊息，不是你的指令</small><h2>這批四件，原內容保留在這裡。</h2>'+overview()+'<p>如果下面的批次元件沒有顯示，或不能操作，請：</p><strong class="fallback-path">開側欄 → 點 Bridge</strong><p>回到同一位幕僚長、同一批。已送過的答案先查送達，不要重送。</p></div><div class="unavailable" data-unavailable>Plugin timeline item unavailable.</div><p class="help">原訊息仍可讀；沒有把未答事項標成完成。</p>'}
function sidebar(){return '<aside class="sidebar"><div class="navhead">Paseo<button class="navclose" data-act="close-menu" aria-label="關閉側欄">×</button></div><button class="navrow">＋　新增工作區</button><button class="navrow">◷　歷史</button><button class="navrow">⌕　搜尋</button><button class="navrow '+(isFallback()?'current':'')+'" data-act="bridge">◉　Bridge <span class="badge">4</span></button><div class="sectionlabel">範例工作區</div><button class="navrow '+(!isFallback()?'current':'')+'" data-act="native">●　幕僚長</button><div class="navmeta">範例主機 · 已連線</div><div class="navfoot">離線圖稿 · 沒有連接任何代理</div></aside>'}
function keyboard(){const row=(keys)=>'<div class="keys">'+keys.map(k=>'<span class="key '+(k.length>1?'wide':'')+'">'+k+'</span>').join('')+'</div>';return '<div class="keyboard" aria-hidden="true"><div class="prediction"><span>日期</span><span>格式</span><span>YYYY-MM-DD</span></div>'+row('QWERTYUIOP'.split(''))+row('ASDFGHJKL'.split(''))+row(['⇧',...'ZXCVBNM'.split(''),'⌫'])+'<div class="keys"><span class="key wide">123</span><span class="key wide">◎</span><span class="key space">空白</span><span class="key wide">換行</span></div><div class="keyboardnote">鍵盤為靜態示意，非手機能力驗收</div></div>'}
function render(){const sent=(qstatus?1:0)+(gstatus?1:0)+(q2done?1:0)+(g2done?1:0),recorded=(gstatus?1:0)+(g2done?1:0);const bad=['unsupported','fallback-menu'].includes(scene);const body=bad?unsupported():'<div class="byline"><span class="dot"></span>幕僚長<span class="time">14:22 · 同一批</span></div><h1 class="opening">'+(scene==='half'||isFallback()?'兩件已送，另外兩件還在。':'這批四件，都在這裡回答。')+'</h1><p class="intro">'+(scene==='permission'?'兩個問題、一個關卡、一件權限。權限要到範例 FO 戊那裡處理。':'兩個問題、兩個關卡。先看「範例試用」，其餘也都留在這裡。')+'</p>'+overview()+question(items[0])+gate(items[1])+question(items[2])+(scene==='permission'?permission():gate(items[3]));
document.querySelector('#app').innerHTML='<div class="shell '+(drawer?'drawer ':'')+(scene==='keyboard'?'keyboardup ':'')+(isFallback()?'fallback':'')+'">'+sidebar()+'<div class="scrim" data-act="close-menu"></div><main class="main"><header class="nativehead"><button class="menu" data-act="menu" aria-label="開啟側欄">'+svg('menu')+'</button><div class="headname"><span class="dot"></span><div>'+(isFallback()?'Bridge':'幕僚長')+'<div class="headdetail">'+(isFallback()?'範例主機 · 幕僚長的同一批':'範例主機 · 原生對話')+'</div></div></div><button class="more" aria-label="對話選單">⋯</button></header><div class="watermark"><span>離線圖稿 · 所有人物與資料虛構</span><span>手機能力未驗</span></div>'+(isFallback()?'<div class="bridgehead">幕僚長　<span class="label-only">同一對話，不重送已送內容</span></div>':'')+'<div class="batchbar"><div class="barinner"><div><div class="batchtitle">這批四件</div><div class="batchmeta">'+(scene==='permission'?'2 個問題 · 1 個關卡 · 1 件權限':'2 個問題 · 2 個關卡')+'</div></div><div class="batchprogress">已送出 '+sent+'／4<br>其中 '+recorded+' 件已記錄</div></div></div><section class="timeline" aria-label="幕僚長原生對話時間線"><div class="chatwidth">'+body+(notice?'<div class="mock-notice" role="status">'+esc(notice)+'</div>':'')+'</div></section><div class="composerwrap"><div class="composer"><div class="composerlabel">只和幕僚長說話 · 不會直接轉達給 FO</div><div class="ordinaryrow"><textarea id="ordinary" placeholder="和幕僚長說話…" aria-label="和幕僚長的一般對話">'+esc(ordinaryDraft)+'</textarea><button class="plain-send" data-act="ordinary" aria-label="傳給幕僚長" '+(ordinaryDraft.trim()?'':'disabled')+'>'+svg('send')+'</button></div></div></div>'+keyboard()+'</main></div>';bind();if(stale){const card=document.querySelector('#g1');card.classList.add('stale-card');const warning=card.querySelector('.warn'),version=card.querySelector('.version'),reload=card.querySelector('.read-new');version.after(warning);warning.after(reload)}if(scene==='permission'){const card=document.querySelector('#permission'),tail=document.createElement('div');tail.style.height=Math.max(0,document.querySelector('.timeline').clientHeight-card.getBoundingClientRect().height)+'px';tail.setAttribute('aria-hidden','true');document.querySelector('.chatwidth').append(tail)}}
function bind(){document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));document.querySelectorAll('[data-question]').forEach(e=>e.oninput=()=>{if(e.dataset.question==='q1')qDraft=e.value;document.querySelector('[data-send="'+e.dataset.question+'"]').disabled=!e.value.trim()});document.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>{const id=b.dataset.send,text=document.querySelector('#answer-'+id).value;if(!text.trim())return;events.push({kind:'question',id,words:text,recipient:items.find(x=>x.id===id).fo});if(id==='q1'){qDraft=text;qstatus='sent';scene='sent';render();position()}else{q2done=true;const card=document.getElementById('q2');card.querySelector('.status').textContent='已送給幕僚長';card.querySelector('.answerinput').disabled=true;b.disabled=true;b.textContent='已送給幕僚長';updateProgress()}});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(stale)return;chosen=b.dataset.choice;render();position('g1')});document.querySelectorAll('[data-second-choice]').forEach(b=>b.onclick=()=>secondGate(b.dataset.secondChoice));const r=document.querySelector('#reason');if(r)r.oninput=()=>{reason=r.value;document.querySelector('[data-confirm]').disabled=stale||chosen!=='准'&&!reason.trim()};const c=document.querySelector('[data-confirm]');if(c)c.onclick=()=>{if(stale||!chosen||chosen!=='准'&&!reason.trim())return;events.push({kind:'gate',id:'g1',words:chosen+(reason?'，'+reason:''),version:gateVersion});gstatus='recorded';scene='recorded';render();position('g1')};document.querySelector('#ordinary').oninput=e=>{ordinaryDraft=e.target.value;document.querySelector('.plain-send').disabled=!ordinaryDraft.trim()}}
function updateProgress(){document.querySelector('.batchprogress').innerHTML='已送出 '+((qstatus?1:0)+(gstatus?1:0)+(q2done?1:0)+(g2done?1:0))+'／4<br>其中 '+((gstatus?1:0)+(g2done?1:0))+' 件已記錄'}
function secondGate(word){if(g2done)return;g2word=word;const card=document.querySelector('#g2');card.querySelectorAll('[data-second-choice]').forEach(b=>b.classList.toggle('chosen',b.dataset.secondChoice===word));let box=card.querySelector('.gate2box');if(!box){box=document.createElement('div');box.className='gate2box';card.append(box)}box.innerHTML='<div class="reasonbox"><label for="reason-g2">'+esc(word)+'的理由'+(word==='准'?'（可選）':'（必填）')+'</label><textarea class="reasoninput" id="reason-g2" aria-label="範例驗收的理由">'+esc(g2reason)+'</textarea><button class="confirm" data-confirm-g2 '+(word!=='准'&&!g2reason.trim()?'disabled':'')+'>Confirm '+esc(word)+' · 範例驗收</button><button class="cancel" data-cancel-g2>取消這次選擇</button></div>';box.querySelector('textarea').oninput=e=>{g2reason=e.target.value;box.querySelector('[data-confirm-g2]').disabled=g2word!=='准'&&!g2reason.trim()};box.querySelector('[data-cancel-g2]').onclick=()=>{g2word='';box.innerHTML='';card.querySelectorAll('[data-second-choice]').forEach(b=>b.classList.remove('chosen'))};box.querySelector('[data-confirm-g2]').onclick=()=>{if(!g2word||g2word!=='准'&&!g2reason.trim())return;g2done=true;events.push({kind:'gate',id:'g2',words:g2word+(g2reason?'，'+g2reason:''),version:1});card.querySelector('.status').textContent='已記錄';card.querySelector('.status').classList.add('good');card.querySelectorAll('[data-second-choice]').forEach(b=>b.disabled=true);box.innerHTML='<div class="delivery good"><strong>已記錄：'+esc(g2word)+'</strong><small>'+esc(g2word+(g2reason?'，'+g2reason:''))+'</small></div>';updateProgress()};position('g2')}
function act(a){if(a==='menu'){drawer=true;render()}if(a==='close-menu'){drawer=false;render()}if(a==='bridge'){drawer=false;scene='fallback-bridge';qstatus='relayed';gstatus='recorded';chosen='准';reason='僅範例環境。';qDraft='日期請用 YYYY-MM-DD。';render();position()}if(a==='native'){scene='landing';drawer=false;render();position()}if(a==='permission'){events.push({kind:'navigation',route:'bridge-named-permission-to-native-fo',recipient:'範例 FO 戊'});notice='離線示意：開啟範例 FO 戊的原生對話；沒有批准或拒絕權限。';render();position('permission')}if(a==='cancel'){chosen='';render();position('g1')}if(a==='read-new'){stale=false;gateVersion=2;chosen='';notice='離線示意：已讀新版，原稿保留；請重新選擇並確認。';render();position('g1')}if(a==='ordinary'){notice='離線示意：這段只和幕僚長談，沒有轉達給 FO。';render()}}
function position(id){const target=id||({question:'q1',sent:'q1',relayed:'q1',gate:'g1',chosen:'g1',reason:'g1','reason-typed':'g1',recorded:'g1',stale:'g1',permission:'permission',keyboard:'q1'}[scene]);const scroll=document.querySelector('.timeline');if(target){const el=document.getElementById(target);scroll.scrollTop=el.offsetTop-scroll.offsetTop}else scroll.scrollTop=0}
function setScenario(id){scene=id;gateVersion=1;q2done=false;g2done=false;g2word='';g2reason='';qstatus=['sent'].includes(id)?'sent':['relayed','half','fallback-bridge'].includes(id)?'relayed':'';gstatus=['recorded','half','fallback-bridge'].includes(id)?'recorded':'';chosen=['chosen','recorded','half','fallback-bridge'].includes(id)?'准':['reason','reason-typed','stale'].includes(id)?'要求修改':'';reason=['reason-typed','stale'].includes(id)?'先補上範例資料的回復步驟。':['recorded','half','fallback-bridge'].includes(id)?'僅範例環境。':'';qDraft=['question','keyboard','sent','relayed','half','fallback-bridge'].includes(id)?'日期請用 YYYY-MM-DD。':'';ordinaryDraft='';stale=id==='stale';drawer=id==='fallback-menu';notice='';events=[];render();position()}
window.mock={setScenario,position,snapshot:()=>({scene,qstatus,gstatus,chosen,reason,qDraft,ordinaryDraft,stale,drawer,events,gateVersion,q2done,g2done,surface:isFallback()?'bridge':'native'})};setScenario(new URLSearchParams(location.search).get('state')||'landing');
</script></body></html>
