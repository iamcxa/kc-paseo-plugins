<!doctype html>
<!-- DISPOSABLE preview for task project-env-browse-vault-survives. Approximates the Paseo settings card; not Paseo's real styles. Delete after the ideation gate. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse vault preview (disposable)</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#6b7280; --border:#e5e7eb; --card:#f9fafb; --btn:#111; --btnfg:#fff; --bad:#b42318; }
  body.dark { --bg:#111418; --fg:#f3f4f6; --muted:#9ca3af; --border:#2a2f37; --card:#181c22; --btn:#f3f4f6; --btnfg:#111; --bad:#f97066; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.35 -apple-system,system-ui,sans-serif; padding:16px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 8px; }
  .card { border:1px solid var(--border); background:var(--card); border-radius:12px; max-width:560px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-top:1px solid var(--border); }
  .row:first-child { border-top:0; }
  .txt { min-width:0; }
  .label { font-weight:600; overflow-wrap:anywhere; }
  .hint { color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
  .err { color:var(--bad); font-size:13px; overflow-wrap:anywhere; }
  .field { border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:13px; min-width:0; max-width:55%; overflow-wrap:anywhere; background:var(--bg); }
  .field.empty { color:var(--muted); }
  button { background:var(--btn); color:var(--btnfg); border:0; border-radius:8px; padding:7px 14px; font:inherit; font-weight:600; min-height:36px; flex:none; }
  button[disabled] { opacity:.5; }
  .panel { max-width:560px; margin-bottom:14px; font-size:12px; color:var(--muted); border:1px dashed var(--border); padding:6px 8px; border-radius:6px; }
  .panel button { min-height:28px; padding:3px 8px; font-size:12px; margin:2px 4px 2px 0; }
</style>
<div class="panel" id="panel">Preview controls (not part of the design):
  <button onclick="pick('one')">one skipped</button>
  <button onclick="pick('clean')">nothing skipped</button>
  <button onclick="pick('all')">all skipped</button>
  <button onclick="pick('fail')">whole list fails</button>
  <button onclick="pick('many')">many skipped</button>
  <button onclick="pick('long')">long title</button>
  <button onclick="document.body.classList.toggle('dark')">dark/light</button>
</div>
<h2>Environment variables</h2>
<div class="card" id="card"></div>
<script>
const FIELDS = ["op://Dev/Linear/credential", "op://Dev/Stripe/api_key", "op://Dev/Stripe/region"];
const SKIP = (t, type) => ({ item: t, reason: "1Password could not read this item" + (type ? " (" + type + ")" : "") });
const SCEN = {
  one:   { refs: FIELDS, skipped: [SKIP("deploy key", "ssh key")] },
  clean: { refs: FIELDS, skipped: [] },
  all:   { refs: [], skipped: [SKIP("deploy key", "ssh key"), SKIP("signing key", "ssh key")] },
  fail:  { error: "1Password rejected the token" },
  many:  { refs: FIELDS, skipped: Array.from({length: 8}, (_, i) => SKIP("key " + (i + 1), "ssh key")) },
  long:  { refs: FIELDS, skipped: [SKIP("A very long item title for the production deployment signing key of the build agent fleet", "ssh key")] },
};
let scenario = "one", phase = "before", data = null;
const q = new URLSearchParams(location.search);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function varRow(name, ref, listed) {
  return `<div class="row"><div class="label">${name}</div><div class="field ${ref ? "" : "empty"}">${esc(ref || "op://vault/item/field")}${listed ? " ▾" : ""}</div></div>`;
}
function render() {
  const listed = data && data.refs && data.refs.length > 0;
  const loading = phase === "loading";
  let h = varRow("LINEAR_API_KEY", "op://Dev/Linear/credential", listed) + varRow("STRIPE_KEY", listed ? "op://Dev/Stripe/api_key" : "", listed);
  h += `<div class="row"><div class="txt"><div class="label">Pick fields from the vault</div><div class="hint">Lists item and field names only; values are never sent to the app.</div>${data && data.error ? `<div class="err">${esc(data.error)}</div>` : ""}</div><button id="browse" ${loading ? "disabled" : ""} onclick="browse()">${loading ? "Loading…" : "Browse vault"}</button></div>`;
  if (data && data.skipped) h += data.skipped.map((s) => `<div class="row"><div class="txt"><div class="label">${esc(s.item)}</div><div class="hint">Not listed: ${esc(s.reason)}</div></div></div>`).join("");
  document.getElementById("card").innerHTML = h;
}
function pick(s) { scenario = s; phase = "before"; data = null; render(); }
function browse() {
  phase = "loading"; data = null; render();
  setTimeout(() => { phase = "done"; data = SCEN[scenario]; render(); }, Number(q.get("delay") || 500));
}
if (q.get("w")) { document.body.style.width = (Number(q.get("w")) - 32) + "px"; }
if (q.get("dark")) document.body.classList.add("dark");
if (q.get("s")) scenario = q.get("s");
if (q.get("e")) SCEN.fail.error = q.get("e");
if (q.get("hide")) document.getElementById("panel").style.display = "none";
render();
if (q.get("run")) browse();
if (q.get("delay") === "99999") { /* hold on loading for a picture */ }
</script>
