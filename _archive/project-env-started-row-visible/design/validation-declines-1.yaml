design_decline_check:
  adrs_read:
    - docs/adr/0002-an-unresolved-variable-is-blanked-and-shown.md (Accepted)
    - docs/adr/0004-reserved-variable-names-are-skipped-not-blanked.md (Accepted)
  rulings:
    - finding: 1
      ruling: upheld
      evidence: built-1 (finished turn, 1280) and built-3 and built-7 (failed turn, 400 and 1280) all show the same amber-triangle row with the same words, in the same place below the last reply and above "Worked for", and the error line "[System Error] Requested mock provider failure" stays the only statement of failure, since the row says "Started without 1 project variable" and does not claim a failure.
      change: none
    - finding: 2
      ruling: upheld
      evidence: Every picture (built-1, 3, 7, 8) shows the one-variable row, which is the content ADR 0002 rules (variable name plus a reason, no value), and it reads correctly in each; a person is not misled about visibility by the row's multi-variable or long-reason wrapping not being pictured. The claim that the row's rendering code is unchanged is the caller's and cannot be checked from a picture, so I rely on it as stated.
      change: none
    - finding: 3
      ruling: upheld
      evidence: built-7 shows the failed turn at 1280 and built-8 shows the stopped turn at 400, both with the row in place above "Worked for", which closes the size gaps; the light theme has no picture, so the decline rests only on the caller's recorded "unverified" limit and the row not changing look, and nothing pictured shows a person acting wrongly on it.
      change: none
