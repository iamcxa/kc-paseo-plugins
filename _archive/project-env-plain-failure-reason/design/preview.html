<!doctype html>
<!-- DISPOSABLE preview for task project-env-plain-failure-reason. Approximates the Paseo settings card; not Paseo's real styles. Delete after the ideation gate. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings Test row preview (disposable)</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#6b7280; --border:#e5e7eb; --card:#f9fafb; --btn:#111; --btnfg:#fff; --bad:#b42318; }
  body.dark { --bg:#111418; --fg:#f3f4f6; --muted:#9ca3af; --border:#2a2f37; --card:#181c22; --btn:#f3f4f6; --btnfg:#111; --bad:#f97066; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.35 -apple-system,system-ui,sans-serif; padding:16px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 8px; }
  .card { border:1px solid var(--border); background:var(--card); border-radius:12px; max-width:560px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-top:1px solid var(--border); }
  .row:first-child { border-top:0; }
  .txt { min-width:0; }
  .label { font-weight:600; overflow-wrap:anywhere; }
  .hint { color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
  button { background:var(--btn); color:var(--btnfg); border:0; border-radius:8px; padding:7px 14px; font:inherit; font-weight:600; min-height:36px; }
  button[disabled] { opacity:.5; }
  .note { max-width:560px; color:var(--muted); font-size:13px; margin-top:8px; }
  .panel { max-width:560px; margin-bottom:14px; font-size:12px; color:var(--muted); border:1px dashed var(--border); padding:6px 8px; border-radius:6px; }
  .panel button { min-height:28px; padding:3px 8px; font-size:12px; margin-right:4px; }
</style>
<div class="panel" id="panel">Preview controls (not part of the design):
  <button onclick="setScenario('mixed')">mixed</button>
  <button onclick="setScenario('allfail')">every cause</button>
  <button onclick="setScenario('allset')">all set</button>
  <button onclick="setScenario('long')">long names</button>
  <button onclick="document.body.classList.toggle('dark')">dark/light</button>
</div>
<h2>Check and save</h2>
<div class="card" id="card">
  <div class="row">
    <div class="txt"><div class="label">Resolve every variable now</div><div class="hint">Shows set or failed per variable, with the reason; never the value.</div></div>
    <button id="test" onclick="runTest()">Test</button>
  </div>
  <div id="results"></div>
  <div class="row"><div class="txt"><div class="label">Save this project</div></div><button>Save</button></div>
</div>
<script>
const TEXT = {
  "no-token": "no token stored for this service account",
  "rejected-token": "1Password rejected the token",
  "missing-field": "field not found in the vault",
  "unreachable": "1Password could not be reached",
  "empty": "the field is empty",
  "outside-vault": "reference points outside the chosen vault",
  "unexpected": "1Password returned an error the plugin does not recognise",
};
const SCEN = {
  mixed: [["LINEAR_API_KEY"], ["SENTRY_TOKEN","missing-field"], ["OPENAI_API_KEY","empty"]],
  allfail: Object.keys(TEXT).map((c,i)=>["VAR_"+(i+1)+"_"+c.toUpperCase().replace(/-/g,"_"), c]),
  allset: [["LINEAR_API_KEY"],["SENTRY_TOKEN"]],
  long: [["A_VERY_LONG_VARIABLE_NAME_FOR_A_VENDOR_API_KEY_USED_BY_THE_BUILD_AGENT","unexpected"],["SHORT"]],
};
let scenario = "mixed";
const q = new URLSearchParams(location.search);
function setScenario(s){ scenario = s; document.getElementById("results").innerHTML = ""; }
function runTest(){
  const b = document.getElementById("test"); b.disabled = true; b.textContent = "Testing…";
  setTimeout(()=>{
    b.disabled = false; b.textContent = "Test";
    document.getElementById("results").innerHTML = SCEN[scenario].map(([n,c]) =>
      `<div class="row"><div class="txt"><div class="label">${n}</div><div class="hint">${c ? "failed: "+TEXT[c] : "set"}</div></div></div>`).join("");
  }, Number(q.get("delay")||400));
}
if (q.get("dark")) document.body.classList.add("dark");
if (q.get("s")) scenario = q.get("s");
if (q.get("run")) { runTest(); }
if (q.get("hide")) document.getElementById("panel").style.display = "none";
</script>
