<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'">
<title>清單旁詳情 · 設計稿審閱</title>
<style>
:root{color-scheme:dark;--bg:#161b18;--panel:#202722;--border:#344038;--text:#edf1ee;--muted:#abb8ae;--green:#8ccfa4}*{box-sizing:border-box}body{height:100dvh;display:flex;flex-direction:column;overflow:hidden;margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}header{padding:18px 24px;border-bottom:1px solid var(--border)}header h1{font-size:21px;margin:0 0 4px}header p{font-size:12px;color:var(--muted);margin:0}a{color:var(--green);text-decoration:none}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);flex:1;min-height:0}aside{overflow:auto;border-right:1px solid var(--border);padding:10px}ol{list-style:none;padding:0;margin:0}.state{width:100%;text-align:left;color:var(--text);padding:10px 12px;border:1px solid transparent;border-radius:6px;background:none;margin-bottom:3px}.state[aria-current=true]{background:#25382b;border-color:#51785c}.state small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.viewer{min-width:0;overflow:auto;padding:20px 24px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.toolbar h2{font-size:18px;margin:0}.toggle{display:flex;gap:6px}.toggle button{padding:5px 12px;min-height:36px;background:none;border:1px solid var(--border);border-radius:5px}.toggle button[aria-pressed=true]{border-color:var(--green);color:var(--green)}#note{font-size:13px;color:var(--muted);margin:8px 0 16px}.screens{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;align-items:start}figure{margin:0;min-width:0}figcaption{color:var(--muted);font-size:11px;margin-bottom:8px}img{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:6px}.screens.desktop{grid-template-columns:1fr}.screens.desktop .phone{display:none}.screens.phone{display:block}.screens.phone .desktop{display:none}.screens.phone .phone{max-width:360px;margin:auto}.links{margin-top:18px;display:flex;gap:18px;font-size:12px}.navkeys{margin-top:10px;color:var(--muted);font-size:11px}@media(max-width:850px){.layout{grid-template-columns:210px minmax(0,1fr)}.screens{grid-template-columns:1fr}.phone{max-width:260px}.viewer{padding:16px}header{padding:14px 16px}header h1{font-size:18px}}@media(max-width:560px){.layout{display:block;height:auto;overflow:auto}aside{height:210px;border-bottom:1px solid var(--border)}.viewer{overflow:visible}.toggle button{min-height:44px}header h1{font-size:17px}}
</style>
<header><h1>先跟指揮官談方向，需要時進待辦找 FO 或查進度，照這個方向做可以嗎？</h1><p>先跟指揮官談方向，需要時進待辦找 FO 或查進度。所有資料虛構；不會傳訊或記錄真實決定。</p></header>
<div class="layout"><aside aria-label="狀態"><ol id="states"></ol></aside><main class="viewer"><div class="toolbar"><h2 id="title"></h2><div class="toggle" aria-label="顯示尺寸"><button data-mode="both" aria-pressed="true">兩者</button><button data-mode="desktop" aria-pressed="false">桌面</button><button data-mode="phone" aria-pressed="false">手機</button></div></div><p id="note"></p><div class="screens" id="screens"><figure class="desktop"><figcaption>桌面 · 1440 × 1000</figcaption><img id="desktop" alt="桌面設計稿"></figure><figure class="phone"><figcaption>手機 · 360 × 780</figcaption><img id="phone" alt="手機設計稿"></figure></div><div class="links"><a id="prototype" target="_blank">開啟可點擊示意 ↗</a><a href="REVIEW.md">逐態說明</a><a href="EVIDENCE.md">驗證範圍</a></div><p class="navkeys">← → 切換狀態 · 左列保留位置 · 圖片為同一方向的兩種尺寸</p></main></div>
<script id="review-scenarios" type="application/json">[{"id": "home", "title": "首頁 · 指揮官", "note": "先跟現有通訊官談方向；桌面待辦在旁邊，手機按 Board。"}, {"id": "commander-question", "title": "指揮官正在問", "note": "問句先行；固定入口的問題只算一次，待辦共七件。"}, {"id": "board", "title": "打開待辦", "note": "指揮官固定在最上方；按種類分組，圖形加文字說明輪到誰。"}, {"id": "open", "title": "從待辦進閘門", "note": "問題與摘要先行，與該 FO 對話；頁面上方一步回指揮官。"}, {"id": "fo-question", "title": "進 FO 對話", "note": "需要細節再找 Demo FO；對話標明含其他任務，收件人清楚。"}, {"id": "return-commander", "title": "回到指揮官", "note": "一次回來，保留草稿與原閘門已送進度；沒有重送決定。"}, {"id": "progress-board", "title": "在待辦查進度", "note": "只看兩件閘門：一件等 Export FO 記錄、一件輪到你。沒有新進度資料。"}, {"id": "progress-detail", "title": "打開進度細節", "note": "已轉送，尚未記錄；對象仍是 Export FO，原列繼續留在待辦。"}, {"id": "all-fos", "title": "完整 FO 名單", "note": "四位 FO 都可進入，包括沒有待辦的 Research FO；不是只把待辦重新分組。"}, {"id": "fo-no-waiting", "title": "沒有待辦，也能找 FO 聊", "note": "Research FO 沒有待辦；仍可看對話、直接傳訊，頂部一步回指揮官。"}]</script><script>
const states=JSON.parse(document.getElementById('review-scenarios').textContent);let selected=states.findIndex(s=>s.id==='home');
const list=document.getElementById('states');states.forEach((s,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.className='state';b.dataset.index=i;const t=document.createElement('span'),n=document.createElement('small');t.textContent=(i+1)+'. '+s.title;n.textContent=s.note;b.append(t,n);b.onclick=()=>select(i);li.append(b);list.append(li);});
function select(i){selected=(i+states.length)%states.length;const s=states[selected];document.querySelectorAll('.state').forEach((b,n)=>b.setAttribute('aria-current',n===selected));document.getElementById('title').textContent=s.title;document.getElementById('note').textContent=s.note;document.getElementById('desktop').src='1440-'+s.id+'.png';document.getElementById('phone').src='360-'+s.id+'.png';document.getElementById('prototype').href='index.html?state='+s.id;}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.getElementById('screens').className='screens '+(b.dataset.mode==='both'?'':b.dataset.mode);document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));});addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();select(selected+(e.key==='ArrowRight'?1:-1));}});select(states.findIndex(s=>s.id==='home'));
</script></html>
