<script id="scenarios" type="application/json">[
  {
    "id": "home",
    "title": "首頁 · 指揮官",
    "note": "先跟現有通訊官談方向；桌面待辦在旁邊，手機按 Board。"
  },
  {
    "id": "commander-question",
    "title": "指揮官正在問",
    "note": "問句先行；固定入口的問題只算一次，待辦共七件。"
  },
  {
    "id": "board",
    "title": "打開待辦",
    "note": "指揮官固定在最上方；按種類分組，圖形加文字說明輪到誰。"
  },
  {
    "id": "open",
    "title": "從待辦進閘門",
    "note": "問題與摘要先行，與該 FO 對話；頁面上方一步回指揮官。"
  },
  {
    "id": "fo-question",
    "title": "進 FO 對話",
    "note": "需要細節再找 Demo FO；對話標明含其他任務，收件人清楚。"
  },
  {
    "id": "return-commander",
    "title": "回到指揮官",
    "note": "一次回來，保留草稿與原閘門已送進度；沒有重送決定。"
  },
  {
    "id": "progress-board",
    "title": "在待辦查進度",
    "note": "只看兩件閘門：一件等 Export FO 記錄、一件輪到你。沒有新進度資料。"
  },
  {
    "id": "progress-detail",
    "title": "打開進度細節",
    "note": "已轉送，尚未記錄；對象仍是 Export FO，原列繼續留在待辦。"
  },
  {
    "id": "all-fos",
    "title": "完整 FO 名單",
    "note": "四位 FO 都可進入，包括沒有待辦的 Research FO；不是只把待辦重新分組。"
  },
  {
    "id": "fo-no-waiting",
    "title": "沒有待辦，也能找 FO 聊",
    "note": "Research FO 沒有待辦；仍可看對話、直接傳訊，頂部一步回指揮官。"
  }
]</script>
<script>
const scenarios=JSON.parse(document.getElementById('scenarios').textContent);
const fixtures=new Set(scenarios.map(x=>x.id));
const requested=new URLSearchParams(location.search).get('state')||'home';
const initial=fixtures.has(requested)?requested:'home';
const sampleReason='Please add the missing rollback check.';
const reviewAsk='Who should review example/demo-project#17 (https://example.invalid/example/demo-project/pull/17)?';
const titles={gate:'Approve the draft checklist?',gate2:'Approve the sample export?',fo:'Which preview should we show first?',comms:'Which review window should we use?',assigned:'Review the checklist export',review:'Who should review the rollback notes?'};
const model={view:'comms',commsAsk:initial==='commander-question',filter:'all',by:'decision',commsSource:initial==='source-loading'?'loading':initial.startsWith('source-failed')?'failed':'loaded',toast:'',drafts:{},messages:{},gates:{gate:{stage:'open',choice:null,reason:'',confirmed:null},gate2:{stage:'open',choice:null,reason:'',confirmed:null}}};
const scrollPositions={};let renderedQueueKey='';let renderedItem='';
const e=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const fos=[{id:'fo-demo',name:'Demo FO',preview:'The sample preview is ready.'},{id:'fo-export',name:'Export FO',preview:'The export check is under review.'},{id:'fo-review',name:'Review FO',preview:'The checklist export is ready.'},{id:'fo-research',name:'Research FO',preview:'The two sample approaches are ready to discuss.'}];
const owner=id=>fos.find(f=>f.id===id)?.name||(id==='comms'||id==='review'?'Comms officer':id==='assigned'?'Review FO':id==='gate2'?'Export FO':'Demo FO');
function seed(){
 model.view=({home:'comms','commander-question':'comms',board:'list',open:'gate','fo-question':'fo','return-commander':'comms','progress-board':'list','progress-detail':'gate2','all-fos':'list','fo-no-waiting':'fo-research'})[initial]||'comms';
 if(['all-fos','fo-no-waiting'].includes(initial))model.by='fo';
 if(initial==='return-commander'){
  const g=model.gates.gate;g.choice='Request changes';g.reason=sampleReason;g.confirmed={choice:g.choice,reason:g.reason};g.stage='sent';
  model.drafts.comms='Please ask Demo FO about the rollback check.';
  model.drafts.gate='Is the sample preview ready?';
  model.messages.comms=['Let us finish the checklist before the sample review.'];
 }
 if(initial.startsWith('progress-')){
  const g=model.gates.gate2;g.choice='Hold';g.reason='Wait for the sample export check.';g.confirmed={choice:g.choice,reason:g.reason};g.stage='relayed';
  model.filter='gate';
 }
}
seed();
function draftKey(id){return id==='review'?'comms':id;}
function statusFor(gate){return ({open:{phase:'your',status:'Your turn · decide'},sent:{phase:'waiting',status:'Waiting · relay'},relayed:{phase:'waiting',status:'Waiting · record'},recorded:{phase:'done',status:'Done · recorded'},closed:{phase:'done',status:'Done · closed'}})[gate.stage];}
function marker(text,phase){return `<span class="status" data-state="${phase}"><span class="status-icon" aria-hidden="true">${({your:'◆',waiting:'◷',done:'✓',error:'!'})[phase]}</span><span class="status-text">${e(text)}</span></span>`;}
function items(){
 const all=[{id:'permission',kind:'permission',title:'Allow access to the sample report folder?',phase:'your',status:'Your turn · permission',owner:'Demo FO',age:'5m'},
 {id:'assigned',kind:'review',title:titles.assigned,phase:'your',status:'Your turn · review',owner:'Review FO',age:'25m'},
 {id:'review',kind:'review',title:titles.review,phase:'your',status:'Your turn · find owner',owner:'example/demo-project #17',age:'35m'}];
 for(const id of ['gate','gate2']){const g=model.gates[id];if(!['recorded','closed'].includes(g.stage))all.push({id,kind:'gate',title:titles[id],...statusFor(g),owner:owner(id),age:id==='gate'?'2h':'45m',closed:id==='gate'});}
 const source=model.commsSource;
 all.push({id:'fo',kind:'ask',title:titles.fo,phase:'your',status:'Your turn · reply',owner:'Demo FO',age:'20m'});if(model.commsAsk)all.push({id:'comms',kind:'ask',title:titles.comms,phase:source==='failed'?'error':source==='loading'?'waiting':'your',status:source==='failed'?'Check · source failed':source==='loading'?'Waiting · source loading':'Your turn · reply',owner:'Comms officer',age:'12m'});return all;
}
function shell(content,native=false){return `<div class="frame"><aside class="host" aria-label="Paseo navigation"><div class="nav">＋ &nbsp; New workspace</div><div class="nav">◷ &nbsp; History</div><div class="nav">⌕ &nbsp; Search</div><div class="nav">◷ &nbsp; Schedules</div><div class="nav active">♧ &nbsp; Bridge</div><div class="project"><span class="label">Workspaces</span><p>▣ &nbsp; Sample workspace</p><p class="small muted">● &nbsp; main</p></div><div class="foot small">⊞ &nbsp; ◉ &nbsp; ▤</div></aside><main class="shell"><header class="topbar"><button class="commander-home ${model.view==='comms'?'active':''}" data-open="comms" aria-label="${model.view==='comms'?'Commander home':'Return to Commander'}">${model.view==='comms'?'◉ &nbsp; Commander':'← Commander'}</button><small>Bridge · Sample workspace</small></header>${content}</main></div>`;}
function commanderCard(){const source=model.commsSource;return `<div class="commander-pinned"><button class="commander-card ${model.view==='comms'||model.view==='review'?'selected':''}" data-open="comms" ${model.view==='comms'?'aria-current="page"':''}><span class="commander-title">◉ &nbsp; Commander</span><span class="commander-sub">Comms officer · direction & coordination</span>${source!=='loaded'?marker(source==='failed'?'Check · source failed':'Waiting · source loading',source==='failed'?'error':'waiting'):model.commsAsk?marker('Your turn · reply','your'):'<span class="commander-sub">Conversation →</span>'}${model.commsAsk?`<span class="commander-question">${titles.comms}</span><span class="item-meta">Question · waiting 12m</span>`:''}</button></div>`;}
function list(){
 const all=items(),counts={all:all.length,permission:0,review:0,gate:0,ask:0};all.forEach(i=>counts[i.kind]++);
 const shown=all.filter(i=>model.filter==='all'||i.kind===model.filter);
 const row=i=>`<button class="item ${i.id==='comms'?'mobile-commander-question ':''}${model.view===i.id?'selected':''}" data-open="${i.id}" aria-label="${e(i.title)}" ${model.view===i.id?'aria-current="true"':''}><span class="item-top">${marker(i.status,i.phase)}<span class="kind">${({permission:'PERMISSION',review:'REVIEW',gate:'GATE',ask:'QUESTION'})[i.kind]}</span></span><span class="item-title">${e(i.title)}</span><span class="item-meta">${e(i.owner)} · ${i.age}${i.closed?'<span class="closed-note">Tab closed</span>':''}</span>${i.id==='permission'?'<span class="item-meta" style="color:var(--green)">Handle in native session ↗</span>':''}</button>`;
 let rows='';
 if(model.by==='decision')for(const [kind,title] of [['permission','Permissions'],['review','Reviews'],['gate','Gates'],['ask','Questions']]){
  const group=shown.filter(i=>i.kind===kind);if(group.length)rows+=`<section class="kind-group" data-group="${kind}"><h3 class="group-label">${title}<span class="group-count">${group.length}</span></h3>${group.map(row).join('')}</section>`;
 }
 if(model.by==='fo')rows=`<div class="roster-heading">All FOs · ${fos.length}</div>`+fos.map(f=>{const waiting=all.filter(i=>i.owner===f.name).length;return `<button class="fo-row ${model.view===f.id?'selected':''}" data-open="${f.id}"><span class="fo-name">${f.name}<span aria-hidden="true">›</span></span><span class="fo-meta">${waiting} waiting item${waiting===1?'':'s'} · Open conversation</span><span class="fo-preview">${e(f.preview)}</span></button>`;}).join('');
 const count=k=>model.commsSource!=='loaded'&&(k==='all'||k==='ask')?'≥'+counts[k]:String(counts[k]);
 return `<aside class="queue" aria-label="Commander and board">${commanderCard()}<div class="queue-head"><div class="queue-title"><h2>Board</h2><span class="small muted">${model.commsSource!=='loaded'?'Known ':''}${all.length} items</span></div><div class="view-switch" role="tablist"><button data-by="decision" class="${model.by==='decision'?'active':''}" role="tab" aria-selected="${model.by==='decision'}">By decision</button><button data-by="fo" class="${model.by==='fo'?'active':''}" role="tab" aria-selected="${model.by==='fo'}">By FO · ${fos.length}</button></div>${model.by==='decision'?`<div class="filters" aria-label="Filter by kind">${[['all','All'],['permission','Permissions'],['review','Reviews'],['gate','Gates'],['ask','Questions']].map(([key,label])=>`<button class="filter" data-filter="${key}" aria-pressed="${model.filter===key}">${label}<b>${count(key)}</b></button>`).join('')}</div>`:''}</div><div class="source ${model.commsSource==='failed'?'failed':''}">${model.commsSource==='failed'?'Could not check the comms officer.<br>This list may be incomplete.<button data-retry>Check comms officer again</button>':model.commsSource==='loading'?'Reading the comms officer…<br>This list may be incomplete.':'Sources checked just now'}</div><div class="queue-scroll">${model.by==='decision'&&model.filter!=='all'?`<div class="countline">${counts[model.filter]} ${({permission:'permission',review:'review',gate:'gate',ask:'question'})[model.filter]} items shown</div>`:''}${rows}${model.by==='decision'&&model.commsAsk&&(model.filter==='all'||model.filter==='ask')?'<p class="countline pinned-count">1 commander question above · counted once</p>':''}</div></aside>`;
}
function nav(id){return `<nav class="detail-nav"><button class="back" data-open="list">${id==='comms'?'Board · '+items().length:'← Board'}</button><span class="small ${id==='comms'?'commander-navowner':''}">${id==='comms'?'Comms officer':e(owner(id))}</span></nav>`;}
function conversation(id){const key=draftKey(id),who=owner(id),fo=fos.find(f=>f.id===id);return `<section class="conversation"><div class="scope"><span>Conversation with ${who} · includes other tasks</span><button data-native="${id}">Open full view ↗</button></div><div class="transcript">${key==='comms'&&model.commsSource==='failed'?'<p class="conversation-error">Could not load the Comms officer conversation. Open the full view to check it.</p>':key==='comms'&&model.commsSource==='loading'?'<p class="conversation-loading">Reading the Comms officer conversation…</p>':id==='comms'&&!model.commsAsk?`<div class="example-thread"><p class="example-label">Example conversation · fictional</p><div class="example-message captain"><span class="speaker">Captain · 8m</span><p>Please focus on the rollback check before the sample review. Ask Demo FO what is still missing.</p></div><div class="example-message"><span class="speaker">Comms officer · 6m</span><p>Demo FO says: “The rollback check is still missing. I can add it before the sample review.”</p></div></div>`:`<span class="speaker">${who} · just now</span><p>${fo?fo.preview:id==='comms'?'I can coordinate the review. Which window should we use?':id==='review'?'I can ask which FO should own this review.':id==='fo'?'The preview is ready. Which part should I show first?':id==='assigned'?'The sample export is ready for a review.':'The draft is ready. Please check the remaining items before the review.'}</p>`}${(model.messages[key]||[]).map(t=>`<p class="bubble">${e(t)}</p>`).join('')}</div></section>`;}

function gateBriefing(id){const g=model.gates[id],done=g.stage==='recorded',closed=g.stage==='closed',progress=['sent','relayed'].includes(g.stage),c=g.confirmed,who=owner(id);return `<section class="briefing"><div class="label">Gate · Validation · Sample workspace</div>${done||closed||progress?`<div class="result-box ${done?'':'progress-box'}" aria-label="Decision result"><div class="result-state">${marker(done?'Done · recorded by '+who:closed?'Done · no longer open':g.stage==='sent'?'Waiting · relay to '+who:'Waiting · record by '+who,done||closed?'done':'waiting')}</div>${c?`<p class="result-decision">${e(c.choice)}</p><p class="result-reason">${e(c.reason||'No reason supplied.')}</p>`:''}${progress?`<p class="muted">${g.stage==='sent'?'Sent to Comms officer · waiting for relay to '+who+'.':'Relayed to '+who+' · waiting for its record.'}</p>`:''}${closed?'<p class="muted">No decision is available here.</p>':''}</div><h1 style="margin-top:18px">${titles[id]}</h1>`:`<h1>${titles[id]}</h1>`}<p class="owner">${owner(id)} · ${done?'decision recorded':closed?'gate closed':"waiting "+(id==='gate'?'2h':'45m')}${id==='gate'?'<span class="closed-note">Tab closed</span>':''}</p>${done||closed||progress?'':`<p class="summary">The draft checklist is ready. Review the sample preview and remaining checks before proceeding.</p><details><summary>Read full briefing ›</summary><div class="full"><p>Check the sample preview, the fictional export and the review window.</p><p>The rollback check is still missing. Request a revision if the draft is not ready.</p></div></details>`}</section>`;}
function otherBriefing(id){const f=fos.find(f=>f.id===id);if(f)return `<section class="briefing"><div class="label">FO conversation · Sample workspace</div><h1>${f.name}</h1><p class="owner">${items().filter(i=>i.owner===f.name).length} waiting items · conversation available</p></section>`;if(id==='comms')return `<section class="briefing commander-briefing ${model.commsAsk?'has-ask':'home-intro'}"><div class="label">Commander · Comms officer</div><h1>${model.commsAsk?titles.comms:'Talk direction with your commander'}</h1><p class="owner">${model.commsAsk?'Waiting for you · 12m':'Your channel to the first officers'}</p>${model.commsAsk?'':'<p class="summary">Talk direction here. Open a board item when you need the details with an FO.</p>'}</section>`;return `<section class="briefing"><div class="label">${id==='review'?'Review · No FO assigned · 35m':id==='assigned'?'Review · example/demo-project #21 · 25m':'Question · Demo FO · waiting 20m'}</div><h1>${id==='review'?'Find an owner for the rollback review':titles[id]}</h1>${id==='review'?'<p class="owner">example/demo-project #17 · inquiry to Comms officer</p>':`<p class="owner">Reply to ${owner(id)}</p>`}${id==='assigned'?'<button class="back" data-external>Open review on GitHub ↗</button>':''}</section>`;}
function dock(id){const key=draftKey(id),g=model.gates[id],canDecide=g?.stage==='open',who=owner(id),draft=model.drafts[key]||'',inquiry=id==='review'&&draft===reviewAsk;return `<footer class="dock"><div class="messagebox"><div class="message-head"><span>Message to ${who}${id==='review'?' · review owner inquiry':''}</span></div><div class="input-line ${inquiry?'inquiry':''}"><textarea id="message" aria-label="Message to ${who}" placeholder="Message ${who}" ${inquiry?'style="height:96px"':''}>${e(draft)}</textarea><button id="send" class="control send" aria-label="${inquiry?'Ask who should review':'Send to '+who}" ${!draft.trim()?'disabled':''}>${inquiry?'Ask who should review':'Send ↗'}</button></div></div>${canDecide?`<div class="choices"><span class="small">Decide via Comms officer</span>${['Approve','Request changes','Hold'].map(choice=>`<button class="control choice" data-choice="${choice}" aria-pressed="${g.choice===choice}">${choice}</button>`).join('')}</div>${g.choice?`<div class="reasonbox"><label for="reason">Reason for ${e(g.choice)} · ${g.choice==='Approve'?'optional':'required'}</label><textarea id="reason" aria-label="Decision reason" placeholder="${g.choice==='Approve'?'Optional reason':'Add a reason before confirming'}">${e(g.reason)}</textarea><div class="confirm-actions"><button id="confirm" class="control confirm" ${g.choice!=='Approve'&&!g.reason.trim()?'disabled':''}>Confirm ${g.choice}</button><button id="cancel" class="control">Cancel</button></div></div>`:''}`:''}</footer>`;}
function native(){return `<section class="native" aria-label="Native agent session"><nav class="detail-nav"><button class="back" data-open="list">← Bridge</button><span class="small">Native agent session</span></nav><div class="native-content"><div class="label">Permission request · Demo FO</div><h1>Allow access to the sample report folder?</h1><p>Demo FO is waiting for a tool permission.</p><div class="native-note"><h2>Continue in this agent session</h2><p>The provider’s permission request is handled here.</p><p class="small">Native-session destination shown for review.</p></div></div></section>`;}
function render(){const previousQueue=document.querySelector('.queue-scroll'),previousReading=document.querySelector('.reading');if(previousQueue?.offsetHeight)scrollPositions[renderedQueueKey]=previousQueue.scrollTop;if(previousReading?.offsetHeight)scrollPositions['reading:'+renderedItem]=previousReading.scrollTop;const id=model.view;if(id==='permission'){document.getElementById('app').innerHTML=shell(native(),true);bind();return;}const open=id!=='list';let content=open?nav(id)+`<div class="reading">${model.gates[id]?gateBriefing(id):otherBriefing(id)}${conversation(id)}</div>`+dock(id):nav('comms')+`<div class="reading">${otherBriefing('comms')}${conversation('comms')}</div>`+dock('comms');document.getElementById('app').innerHTML=shell(`<div class="workspace ${open?'has-detail':''}">${list()}<section class="detail" aria-label="Selected item">${model.toast?`<div class="toast" role="status">${e(model.toast)}</div>`:''}${content}</section></div>`);renderedQueueKey='queue:'+model.by+':'+model.filter;renderedItem=id;document.querySelector('.queue-scroll').scrollTop=scrollPositions[renderedQueueKey]||0;const reading=document.querySelector('.reading');if(reading)reading.scrollTop=scrollPositions['reading:'+id]||0;bind();}
function navigate(view){model.toast='';if(view==='review'&&!model.drafts.comms)model.drafts.comms=reviewAsk;model.view=view;history.pushState({view},'',location.pathname+location.search+'#'+view);render();}
function bind(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>navigate(b.dataset.open));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{model.filter=b.dataset.filter;render();});document.querySelectorAll('[data-by]').forEach(b=>b.onclick=()=>{model.by=b.dataset.by;render();});document.querySelector('[data-retry]')?.addEventListener('click',()=>{model.commsSource='loaded';model.toast='Source checked · sample data';render();});document.querySelectorAll('[data-native]').forEach(b=>b.onclick=()=>{model.toast='Full agent view would open here · offline preview';render();});document.querySelector('[data-external]')?.addEventListener('click',()=>{model.toast='GitHub review destination · offline preview';render();});
 const id=model.view==='list'?'comms':model.view,key=draftKey(id),g=model.gates[id];document.getElementById('message')?.addEventListener('input',event=>{model.drafts[key]=event.target.value;document.getElementById('send').disabled=!event.target.value.trim();});document.getElementById('send')?.addEventListener('click',()=>{const text=(model.drafts[key]||'').trim();if(!text)return;(model.messages[key]??=[]).push(text);model.drafts[key]='';model.toast=id==='review'?'Inquiry sent to Comms officer':'Message sent to '+owner(id);render();});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{g.choice=b.dataset.choice;render();});document.getElementById('reason')?.addEventListener('input',event=>{g.reason=event.target.value;document.getElementById('confirm').disabled=g.choice!=='Approve'&&!g.reason.trim();});document.getElementById('cancel')?.addEventListener('click',()=>{g.choice=null;render();});document.getElementById('confirm')?.addEventListener('click',()=>{if(!g||!g.choice||g.choice!=='Approve'&&!g.reason.trim())return;g.confirmed={choice:g.choice,reason:g.reason};g.stage='sent';render();});}
history.replaceState({view:model.view},'',location.pathname+location.search+'#'+model.view);
addEventListener('popstate',event=>{model.view=event.state?.view||'comms';model.toast='';render();});
window.mock={scenarios,fos,reviewAsk,setSource(source){model.commsSource=source;render();},snapshot:()=>JSON.parse(JSON.stringify(model)),receive(stage,id='gate'){const g=model.gates[id];if(!g.confirmed||!['relayed','recorded'].includes(stage))throw Error('A confirmed decision is required');g.stage=stage;render();}};
render();
</script>
</html>
