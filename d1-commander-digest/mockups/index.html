const pointContexts=[[{"label": "這件事", "sentence": "在準備預約流程的範例團隊試用，還不涉及正式上線。", "seq": 2}, {"label": "之前發生", "sentence": "先前取消後的狀態沒有保留，修正前不能安排試用。", "seq": 4}, {"label": "現在需要你", "sentence": "現在需要安排時間與參與者，之後才能開始試用。", "seq": 8}], [{"label": "這件事", "sentence": "在準備範例資料匯入，不動正式資料。", "seq": 2}, {"label": "之前發生", "sentence": "來源與目標欄位還沒對上，因此無法試跑。", "seq": 4}, {"label": "現在需要你", "sentence": "先確認日期欄位的對應；確認前仍不能試跑。", "seq": 8}], [{"label": "這件事", "sentence": "這次只決定範例團隊是否開始試用，不是正式上線。", "seq": 2}, {"label": "之前發生", "sentence": "清單先前缺少取消步驟，當時還沒準備完成。", "seq": 4}, {"label": "現在需要你", "sentence": "現在要你決定是否試用；若暫緩，就不開始。", "seq": 10}]];

const anchorSequences=[6,6,8];
function sourceAt(pointIndex,seq){const entry=timelines[pointIndex].find(item=>item.seq===seq);if(!entry||entry.role!=='assistant')throw Error('No exact FO source');return {...entry,original:entry.text,pointIndex}}
function replaySources(){const seqs=s.sourceVariants[s.point]==='long'&&s.point===2?[1,4,8]:[anchorSequences[s.point]];return seqs.map(seq=>sourceAt(s.point,seq))}
function windowFor(source){return s.windows[source.id]??{before:2,after:2}}
function windowEntries(source){const entries=timelines[source.pointIndex];const index=entries.findIndex(item=>item.id===source.id);const span=windowFor(source);return entries.slice(Math.max(0,index-span.before),Math.min(entries.length,index+span.after+1))}
function changeWindow(sourceId,side){const source=replaySources().find(item=>item.id===sourceId);if(!source)return;const before=document.querySelector('.replay-scroll');const scroll=before.scrollTop,height=before.scrollHeight;const span=windowFor(source);s.windows[source.id]={...span,[side]:span[side]+2};render();requestAnimationFrame(()=>{const pane=document.querySelector('.replay-scroll');pane.scrollTop=side==='before'?scroll+pane.scrollHeight-height:scroll})}
function openContextSource(index){const line=pointContexts[s.point][index];const source=replaySources()[0];const span=windowFor(source);const distance=line.seq-source.seq;s.windows[source.id]={before:Math.max(span.before,-distance),after:Math.max(span.after,distance)};s.focusEntry=line.seq;render();requestAnimationFrame(()=>{const entry=document.querySelector(`.source-block[data-source-id="${source.id}"] [data-seq="${line.seq}"]`);entry?.scrollIntoView({block:'center'});entry?.focus({preventScroll:true})})}
function contextPanel(){if(s.modal==='missing')return '<section class="how-here"><h3>前因後果 · Commander</h3><p class="context-unavailable">脈絡來源目前無法核對。</p></section>';return `<section class="how-here"><h3>前因後果 · Commander</h3>${pointContexts[s.point].map((line,index)=>{const source=sourceAt(s.point,line.seq);return `<div class="context-line" data-context-seq="${line.seq}"><span class="context-kind">${line.label}</span><p>${line.sentence}</p><button data-context-source="${index}" aria-label="查看${line.label}的精確原文">${source.fo} · ${source.time} ↗</button></div>`}).join('')}</section>`}
function sourceWindow(source){const entries=windowEntries(source);const first=entries[0].seq,last=entries.at(-1).seq;const all=timelines[source.pointIndex];return `<section class="source-block" data-source-id="${source.id}" data-point-id="${source.pointId}" data-fo-id="${source.foId}"><div class="source-meta"><b>${source.fo} · 原文所在的對話</b><span>${source.time}</span></div><button class="window-more" data-window-before="${source.id}" ${first===all[0].seq?'disabled':''}>${first===all[0].seq?'已到對話起點':'更早的對話 ↑'}</button><div class="timeline-window">${entries.map(entry=>`<article tabindex="-1" class="timeline-entry ${entry.id===source.id?'cited':''} ${s.focusEntry===entry.seq?'focused-entry':''}" data-seq="${entry.seq}" data-fo-id="${entry.foId}" data-entry-id="${entry.id}" data-role="${entry.role}"><div class="entry-meta"><span>${entry.role==='assistant'?entry.fo:'對話訊息'}${entry.id===source.id?' · 引用原文':''}</span><time>${entry.time}</time></div>${entry.id===source.id?`<blockquote class="quote">「${esc(entry.text)}」</blockquote>`:`<div class="timeline-text">${esc(entry.text)}</div>`}</article>`).join('')}</div><button class="window-more" data-window-after="${source.id}" ${last===all.at(-1).seq?'disabled':''}>${last===all.at(-1).seq?'已到目前最新':'更後的對話 ↓'}</button></section>`}
const gatePhases={sent:{label:'已送出 · 尚未記錄',detail:'等待 Commander 轉交試用 FO。'},relayed:{label:'已轉交 · 尚未記錄',detail:'試用 FO 已收到，等待關卡記錄。'},recorded:{label:'已記錄',detail:'試用 FO 已記錄這次決定。'}};
function gateReceipt(){const phase=gatePhases[s.gateProgress];return `<div class="sent-status" role="status"><strong>${phase.label}</strong>你的決定：${esc(s.chosen)}${s.reason?'，'+esc(s.reason):''}<br>${phase.detail}</div>`}

const gateName='開放預約流程試用？';
function namedGate(){const progress=s.gateSent?gatePhases[s.gateProgress].label:'◆ 等你決定';return `<button class="named-gate ${s.gateSent?'settled':''}" data-action="gate" aria-label="關卡：試用 FO，預約流程，驗證，${gateName}，${progress}"><span class="waiting">${progress}</span><strong>${gateName}<span class="phone-arrow"> ↗</span></strong><small>試用 FO · 預約流程 · 驗證</small></button>`}
function frame(content){return `<div class="shell"><aside class="appnav"><div class="navrow">＋ <span>New workspace</span></div><div class="navrow">◴ <span>History</span></div><div class="navrow">⌕ <span>Search</span></div><div class="navrow active">♧ <span>Bridge</span></div><div class="workspace">WORKSPACE<br><b>範例工作區</b><br>● main</div><div class="navbottom">⊞　◉　▤</div></aside><header class="topbar"><span>Bridge</span><span class="demo-label">範例工作區 · 全部資料虛構</span></header><aside class="board"><button class="commander-entry" data-action="home"><strong>◉ Commander</strong><small>Comms officer · 方向與協調</small></button><h2>${s.gateSent?'決定進度':'待你決定'}</h2>${namedGate()}<div class="section-label">工作進度</div><div class="fo-row">預約 FO<small>預約流程 · 等安排試用</small></div><div class="fo-row">匯入 FO<small>資料匯入 · 欄位對照受阻</small></div><div class="fo-row">研究 FO<small>尚無可確認的新回報</small></div></aside><main class="main">${content}</main></div>`}
function head(title,back=false){return `<div class="mainhead">${back?'<button class="back" data-action="home">← Commander</button>':`<span>${title}</span>`}<button data-action="board">Board</button></div><div class="subhead"><span>${back?title:'Comms officer · idle'}</span></div>`}
function digest(){return `<div class="digest-title"><span class="co-dot"></span><strong>Commander</strong></div><div class="collected">14:20 收集 · 只讀既有回報</div>${points.map((p,i)=>`<section class="point"><div class="point-label ${p.tone}">${p.label}</div><p>${p.sentence}</p><button class="replay-link" data-replay="${i}" aria-label="Replay：${p.sentence}">Replay ↗</button></section>`).join('')}<div class="unknown"><strong>進度未知</strong> · 研究 FO 尚無可確認的新回報。</div>`}
function composer(fo=false){const draft=fo?s.foDraft:s.draft;return `<div class="composer-wrap"><div class="composer">${!fo&&s.context!==null?`<div class="context"><span>關於：${points[s.context].sentence}</span><button data-action="remove-context" aria-label="移除這句上下文">×</button></div>`:''}<div class="composer-hint">↑ 傳給 ${fo?(s.foTarget?.fo||points[s.point].fo):'Commander'}</div><div class="input-row"><textarea id="message" class="draft-caret" aria-label="${fo?'FO 訊息':'Commander 訊息'}" placeholder="${fo?'詢問這個細節…':'輸入一般方向，或繼續討論…'}">${esc(draft)}</textarea><button class="send" data-action="send" aria-label="送出${fo?' FO 訊息':'給 Commander'}" ${draft.trim()?'':'disabled'}>↑</button></div></div></div>`}
function commander(){return head('Commander')+`<div class="conversation"><div class="chat-width"><div class="user-row"><div class="bubble">先把影響試用的重點告訴我。</div></div>${digest()}${s.sent.map(message=>`<div class="user-row sent-group">${message.context?`<div class="sent-context" data-digest-id="${esc(message.context.digestId)}" data-point-id="${esc(message.context.pointId)}"><small>回覆的摘要 · Commander 14:20</small><span>${esc(message.context.sentence)}</span></div>`:''}<div class="bubble" data-sent-message>${esc(message.words)}</div></div>`).join('')}</div></div><div class="mobile-gate">${namedGate()}</div>`+composer()}
function replay(){const p=points[s.point];const missing=s.modal==='missing';const sources=replaySources();const unique=[...new Map(sources.map((source,index)=>[source.fo,index])).entries()];return `<div class="modal-shade"><section class="replay-card contextual ${s.sourceVariants[s.point]==='long'?'long':''}" role="dialog" aria-modal="true" aria-labelledby="replay-title"><div class="sheet-handle"></div><div class="modal-top"><h2 id="replay-title">Replay</h2><button class="close" data-action="close" aria-label="關閉 Replay">×</button></div><div class="replay-heading"><div class="replay-label">Commander 的這句話</div><p class="replay-sentence">${p.sentence}</p></div><div class="replay-scroll" tabindex="0" aria-label="脈絡與原文對話">${contextPanel()}${missing?`<div class="source-meta"><b>${p.fo} · 引用資訊</b><span>今天 ${p.time}</span></div><div class="unavailable" role="status"><strong>找不到這段原文</strong><p>原文與前後對話目前無法核對。你仍可開啟 FO 對話。</p></div>`:sources.map(sourceWindow).join('')}</div><div class="replay-actions">${s.choosingFo?`<div class="fo-picker">${unique.map(([name,index])=>`<button data-fo-source="${index}">${name} ↗</button>`).join('')}</div>`:''}<button class="action" data-action="open-fo">開啟 FO <span>↗</span></button><button class="action" data-action="discuss">繼續討論 <span>↩</span></button><button class="action primary" data-action="new-decision">回覆新決定 <span>↩</span></button></div></section></div>`}
function gate(){return head('關卡 · 試用 FO',true)+`<div class="detail-body"><div class="inner"><div class="eyebrow">關卡 · 驗證 · 預約流程</div><h1>${gateName}</h1><div class="gate-meta">試用 FO · 今天 14:18<br>決定目標：預約流程的試用驗證</div><section class="briefing"><h2>完整關卡說明</h2><h3>這次要決定</h3><p>是否讓範例團隊開始試用預約流程。這個決定只涵蓋試用，不包含正式上線。</p><h3>已提供的結果</h3><p>預約建立與取消的修正已完成；試用清單包含建立、改期及取消三個情境。</p><h3>仍需留意</h3><p>這是離線虛構說明，沒有真實試用結果。若要求修改或暫緩，請寫明原因再確認。</p></section></div></div><div class="gate-controls"><div class="inner">${s.gateSent?gateReceipt():`<div class="label">由 Commander 轉交這個關卡決定</div><div class="choices">${['准','要求修改','暫緩'].map((word,i)=>`<button class="choice ${i===0?'approve':i===1?'revise':''} ${s.chosen===word?'chosen':''}" data-choice="${word}" aria-pressed="${s.chosen===word}">${word}</button>`).join('')}</div>${s.chosen?`<label class="reason-label" for="reason">${s.chosen}的原因${s.chosen==='准'?'（可省略）':'（必填）'}</label><textarea id="reason" class="reason" placeholder="${s.chosen==='准'?'可補充條件或原因':'請寫明需要修改或暫緩的原因'}">${esc(s.reason)}</textarea><div class="confirm-row"><button id="confirm" class="confirm" data-action="confirm" ${s.chosen!=='准'&&!s.reason.trim()?'disabled':''}>Confirm ${s.chosen}</button><button class="cancel" data-action="cancel-choice">取消</button></div>`:''}`}</div></div>`}
function fo(){const p=s.foTarget||points[s.point];if(s.unavailablePoint===s.point)return head(p.fo,true)+`<div class="conversation"><div class="chat-width"><div class="unavailable"><strong>回報目前無法讀取</strong><p>這裡只示意開啟 ${p.fo} 對話，沒有補入遺失原文。</p></div></div></div>`+composer(true);return head(p.fo,true)+`<div class="conversation"><div class="chat-width"><div class="byline">${p.fo} · 今天 ${p.time}</div><p style="font-size:15px;line-height:1.85;white-space:pre-wrap;margin:0">${esc(p.original)}</p></div></div>`+composer(true)}
function board(){return head('Board',true)+`<div class="board-mobile"><button class="commander-entry" data-action="home"><strong>◉ Commander</strong><small>方向與協調</small></button><div class="section-label">${s.gateSent?'決定進度':'待你決定'}</div>${namedGate()}<div class="section-label">工作進度</div><div class="fo-row">預約 FO<small>等安排試用</small></div><div class="fo-row">匯入 FO<small>欄位對照受阻</small></div><div class="fo-row">研究 FO<small>尚無可確認的新回報</small></div></div>`}
function render(focus){document.querySelector('#app').innerHTML=frame(s.view==='gate'?gate():s.view==='fo'?fo():s.view==='board'?board():commander())+(s.modal?replay():'');bind();if(focus)requestAnimationFrame(()=>document.querySelector(focus)?.focus())}
function bind(){document.querySelectorAll('[data-window-before]').forEach(b=>b.onclick=()=>changeWindow(b.dataset.windowBefore,'before'));document.querySelectorAll('[data-window-after]').forEach(b=>b.onclick=()=>changeWindow(b.dataset.windowAfter,'after'));document.querySelectorAll('[data-context-source]').forEach(b=>b.onclick=()=>openContextSource(Number(b.dataset.contextSource)));document.querySelectorAll('[data-fo-source]').forEach(b=>b.onclick=()=>{s.foTarget=replaySources()[Number(b.dataset.foSource)];s.view='fo';s.modal=null;s.choosingFo=false;render('.back')});document.querySelectorAll('[data-replay]').forEach(b=>b.onclick=()=>{s.point=Number(b.dataset.replay);s.windows={};s.focusEntry=null;s.foTarget=null;s.choosingFo=false;s.modal=s.unavailablePoint===s.point?'missing':'replay';render('.close')});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(s.gateSent)return;s.chosen=b.dataset.choice;render(s.chosen==='准'?'#confirm':'#reason')});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));const input=document.querySelector('#message');if(input)input.oninput=()=>{s[s.view==='fo'?'foDraft':'draft']=input.value;document.querySelector('.send').disabled=!input.value.trim()};const reason=document.querySelector('#reason');if(reason)reason.oninput=()=>{s.reason=reason.value;document.querySelector('#confirm').disabled=s.chosen!=='准'&&!s.reason.trim()};document.querySelector('.modal-shade')?.addEventListener('click',e=>{if(e.target.classList.contains('modal-shade'))action('close')})}
function action(name){if(name==='close'){s.modal=null;s.choosingFo=false;render(`[data-replay="${s.point}"]`)}if(name==='home'){s.view='commander';s.modal=null;render()}if(name==='board'){s.view='board';s.modal=null;render()}if(name==='open-fo'){const sources=replaySources();if(new Set(sources.map(x=>x.fo)).size>1){s.choosingFo=!s.choosingFo;render('.fo-picker button')}else{s.foTarget=sources[0];s.view='fo';s.modal=null;render('.back')}}if(name==='discuss'||name==='new-decision'){s.context=s.point;s.modal=null;s.view='commander';render('#message')}if(name==='remove-context'){s.context=null;render('#message')}if(name==='gate'){s.view='gate';s.modal=null;render('.back')}if(name==='cancel-choice'&&!s.gateSent){s.chosen=null;s.reason='';render('[data-choice="准"]')}if(name==='confirm'&&!s.gateSent&&s.chosen&&(s.chosen==='准'||s.reason.trim())){s.gateSent=true;s.gateProgress='sent';s.confirmCount++;render('.back')}if(name==='send'){if(s.view==='fo'){if(!s.foDraft.trim())return;s.foDraft='';render('#message')}else{if(!s.draft.trim())return;s.sent.push({words:s.draft,context:s.context===null?null:contextFor(s.context)});s.draft='';s.context=null;render('#message');requestAnimationFrame(()=>{const x=document.querySelector('.conversation');x.scrollTop=x.scrollHeight})}}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.modal){e.preventDefault();action('close')}if(e.key==='Tab'&&s.modal){const buttons=[...document.querySelectorAll('.replay-card button')];const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function setScenario(id){Object.assign(s,{view:'commander',modal:null,point:2,context:null,draft:'',foDraft:'',sent:[],chosen:null,reason:'',gateSent:false,gateProgress:'unconfirmed',confirmCount:0,sourceVariants:{},windows:{},focusEntry:null,unavailablePoint:null,choosingFo:false,foTarget:null,scenario:id});if(id==='replay')s.modal='replay';if(id==='replay-booking'){s.modal='replay';s.point=0}if(id==='replay-import'){s.modal='replay';s.point=1}if(id==='replay-expanded'){s.modal='replay';s.windows={'trial-fo-8':{before:4,after:4}}}if(id==='source-missing'){s.modal='missing';s.unavailablePoint=2}if(id==='replay-long'||id==='replay-long-end'){s.modal='replay';s.sourceVariants={2:'long'}}if(id==='fo-chat')s.view='fo';if(id==='discuss'){s.context=2;s.draft='試用前還有哪個風險需要先處理？'}if(id==='direction-draft')s.draft='先完成試用安排，再處理其他改動。';if(id==='direction-sent')s.sent=[{words:'先完成試用安排，再處理其他改動。',context:null}];if(id==='context-sent')s.sent=[{words:'請先補齊取消預約的試用步驟。',context:contextFor(2)}];if(id==='decision-context')s.context=2;if(id.startsWith('gate-'))s.view='gate';if(id==='gate-confirm')s.chosen='准';if(id==='gate-reason-empty'||id==='gate-reason-ready')s.chosen='要求修改';if(id==='gate-reason-ready')s.reason='請先補齊取消預約的試用步驟。';if(['gate-sent','gate-relayed','gate-recorded'].includes(id)){s.chosen='准';s.gateSent=true;s.gateProgress=id.slice(5);s.confirmCount=1}render();if(['discuss','direction-draft','decision-context'].includes(id))document.querySelector('#message')?.focus();if(id==='gate-reason-ready')document.querySelector('#reason')?.focus();if(id==='context-sent'||id==='direction-sent')requestAnimationFrame(()=>{const panel=document.querySelector('.conversation');panel.scrollTop=panel.scrollHeight});if(id==='replay-expanded')requestAnimationFrame(()=>document.querySelector('.source-block [data-seq="8"]')?.scrollIntoView({block:'center'}));if(id==='replay-long-end')requestAnimationFrame(()=>{const panel=document.querySelector('.replay-scroll');panel.scrollTop=panel.scrollHeight})}
window.mock={scenarios,setScenario,setGateProgress:progress=>{if(!s.gateSent||!gatePhases[progress])throw Error('Only an existing fictional decision can advance');s.gateProgress=progress;render()},snapshot:()=>JSON.parse(JSON.stringify(s))};setScenario(new URLSearchParams(location.search).get('state')||'digest');
</script></body></html>
