<script id="scenarios" type="application/json">[{"id": "digest", "title": "先讀這輪摘要", "note": "三點由 Commander 改寫；研究 FO 沒有回報，明示未知。"}, {"id": "replay", "title": "看這句的原文", "note": "桌面卡／手機 sheet；句子、FO 名稱、時間、原文與三個出口。"}, {"id": "replay-long", "title": "長原文與多份來源", "note": "來源內容獨立捲動；三個出口固定可見。"}, {"id": "replay-long-end", "title": "長原文：捲到最後", "note": "最後兩份來源可讀，三個出口仍在；開 FO 時明確選姓名。"}, {"id": "source-missing", "title": "原文找不到", "note": "不拿相似文字補上，明示不可用；仍可開 FO。"}, {"id": "fo-chat", "title": "開啟 FO", "note": "只示意進入指定 FO 與返回 Commander，未測宿主。"}, {"id": "discuss", "title": "留在 Commander 討論", "note": "原句作可移除上下文，草稿未送出。"}, {"id": "context-sent", "title": "回覆後，引用仍保留", "note": "摘要點識別與原句隨訊息保留，與使用者自己的文字分開。"}, {"id": "direction-draft", "title": "一般方向：直接輸入", "note": "不開 Replay，輸入後按送出。"}, {"id": "direction-sent", "title": "一般方向：按送出後", "note": "虛構使用者訊息只代表本機示意；沒有關卡目標或記錄。"}, {"id": "decision-context", "title": "從原句回覆新決定", "note": "先回 Commander，尚未指定關卡；須另按具名入口。"}, {"id": "gate-briefing", "title": "按具名關卡，讀說明", "note": "目標為試用 FO／預約流程／驗證，不能由摘要來源推定。"}, {"id": "gate-confirm", "title": "選擇後，再次確認", "note": "選准仍未送出；須按 Confirm。"}, {"id": "gate-reason-empty", "title": "修改需要原因", "note": "尚未輸入原因，Confirm 不可用；暫緩同理。"}, {"id": "gate-reason-ready", "title": "填原因後，等待確認", "note": "原因屬這個具名關卡；尚未送出。"}, {"id": "gate-sent", "title": "確認後，尚未記錄", "note": "送出／轉交／已記錄保持分開，不畫成自動完成。"}, {"id": "gate-relayed", "title": "已轉交，尚未記錄", "note": "具名入口與重新開啟的詳情保留相同決定及進度。"}, {"id": "gate-recorded", "title": "已記錄，重開不重送", "note": "保留原決定，沒有第二個 Confirm；不代表工作已全部完成。"}]</script>
<script>
const scenarios=JSON.parse(document.querySelector('#scenarios').textContent);
const points=[
 {label:'已更新',tone:'',sentence:'預約流程已修正，下一步是安排試用。',fo:'預約 FO',time:'14:12',original:'已完成預約流程修正。試用尚未開始，等安排時間。'},
 {label:'受阻',tone:'blocked',sentence:'資料匯入還卡在欄位對照，尚未開始試跑。',fo:'匯入 FO',time:'14:15',original:'欄位對照還沒定案，資料匯入尚未開始試跑。'},
 {label:'等你決定',tone:'waiting',sentence:'試用清單已備好，等你決定是否開放試用。',fo:'試用 FO',time:'14:18',original:'試用清單已備妥，驗證關卡等待決定：是否開放預約流程試用？'}

const digestId='fictional-digest-1420';
const contextFor=index=>({digestId,pointId:points[index].id,sentence:points[index].sentence});
const longSources=[
 {id:'trial-report-1418',fo:'試用 FO',time:'14:18',original:'試用清單已備妥，驗證關卡等待決定：是否開放預約流程試用？這份清單只涵蓋範例團隊的預約建立、改期與取消，不包含正式上線。\n\n建立預約時，要先選日期與時段，再確認預約內容。改期時要保留原有服務項目，並明確顯示新時段。取消時要先確認使用者的選擇，再把結果留在清單中，不能只把畫面關掉便當作已完成。\n\n試用前的準備已列在同一份清單：先選範例帳號，再逐項確認流程。任何一項無法完成，都要寫下操作前的狀態、實際結果及原本預期，回到這個關卡討論，不擅自把試用範圍擴大。\n\n這次等待的是試用範圍的決定。若需要補充步驟或暫緩，請在這個具名關卡附上原因；一般方向仍是討論內容，不代表已經記錄關卡決定。所有這些資料都只是虛構示意。'},
 {id:'booking-report-1412',fo:'預約 FO',time:'14:12',original:'預約流程的修正已完成。清單已有建立、改期與取消三個試用情境，各情境保留操作前後的狀態。\n\n試用尚未開始，仍待試用關卡決定。這份回報提供流程準備的細節，不能代替試用結果，也不代表正式上線已獲批准。'},
 {id:'trial-report-1416',fo:'試用 FO',time:'14:16',original:'已把預約 FO 提供的情境加入試用清單。開始之前仍須確認本次只開放範例團隊使用。\n\n試用清單已準備好，但尚未收到是否開放試用的決定；若決定要求修改，會依具名關卡中記錄的原因更新清單。'}
];
function replaySources(){return s.longOriginal?longSources:[{id:points[s.point].id+'-source',fo:points[s.point].fo,time:points[s.point].time,original:points[s.point].original}]}
const gatePhases={sent:{label:'已送出 · 尚未記錄',detail:'等待 Commander 轉交試用 FO。'},relayed:{label:'已轉交 · 尚未記錄',detail:'試用 FO 已收到，等待關卡記錄。'},recorded:{label:'已記錄',detail:'試用 FO 已記錄這次決定。'}};
function gateReceipt(){const phase=gatePhases[s.gateProgress];return `<div class="sent-status" role="status"><strong>${phase.label}</strong>你的決定：${esc(s.chosen)}${s.reason?'，'+esc(s.reason):''}<br>${phase.detail}</div>`}

const gateName='開放預約流程試用？';
function namedGate(){const progress=s.gateSent?gatePhases[s.gateProgress].label:'◆ 等你決定';return `<button class="named-gate ${s.gateSent?'settled':''}" data-action="gate" aria-label="關卡：試用 FO，預約流程，驗證，${gateName}，${progress}"><span class="waiting">${progress}</span><strong>${gateName}<span class="phone-arrow"> ↗</span></strong><small>試用 FO · 預約流程 · 驗證</small></button>`}
function frame(content){return `<div class="shell"><aside class="appnav"><div class="navrow">＋ <span>New workspace</span></div><div class="navrow">◴ <span>History</span></div><div class="navrow">⌕ <span>Search</span></div><div class="navrow active">♧ <span>Bridge</span></div><div class="workspace">WORKSPACE<br><b>範例工作區</b><br>● main</div><div class="navbottom">⊞　◉　▤</div></aside><header class="topbar"><span>Bridge</span><span class="demo-label">範例工作區 · 全部資料虛構</span></header><aside class="board"><button class="commander-entry" data-action="home"><strong>◉ Commander</strong><small>Comms officer · 方向與協調</small></button><h2>${s.gateSent?'決定進度':'待你決定'}</h2>${namedGate()}<div class="section-label">工作進度</div><div class="fo-row">預約 FO<small>預約流程 · 等安排試用</small></div><div class="fo-row">匯入 FO<small>資料匯入 · 欄位對照受阻</small></div><div class="fo-row">研究 FO<small>尚無可確認的新回報</small></div></aside><main class="main">${content}</main></div>`}
function head(title,back=false){return `<div class="mainhead">${back?'<button class="back" data-action="home">← Commander</button>':`<span>${title}</span>`}<button data-action="board">Board</button></div><div class="subhead"><span>${back?title:'Comms officer · idle'}</span></div>`}
function digest(){return `<div class="digest-title"><span class="co-dot"></span><strong>Commander</strong></div><div class="collected">14:20 收集 · 只讀既有回報</div>${points.map((p,i)=>`<section class="point"><div class="point-label ${p.tone}">${p.label}</div><p>${p.sentence}</p><button class="replay-link" data-replay="${i}" aria-label="Replay：${p.sentence}">Replay ↗</button></section>`).join('')}<div class="unknown"><strong>進度未知</strong> · 研究 FO 尚無可確認的新回報。</div>`}
function composer(fo=false){const draft=fo?s.foDraft:s.draft;return `<div class="composer-wrap"><div class="composer">${!fo&&s.context!==null?`<div class="context"><span>關於：${points[s.context].sentence}</span><button data-action="remove-context" aria-label="移除這句上下文">×</button></div>`:''}<div class="composer-hint">↑ 傳給 ${fo?(s.foTarget?.fo||points[s.point].fo):'Commander'}</div><div class="input-row"><textarea id="message" class="draft-caret" aria-label="${fo?'FO 訊息':'Commander 訊息'}" placeholder="${fo?'詢問這個細節…':'輸入一般方向，或繼續討論…'}">${esc(draft)}</textarea><button class="send" data-action="send" aria-label="送出${fo?' FO 訊息':'給 Commander'}" ${draft.trim()?'':'disabled'}>↑</button></div></div></div>`}
function commander(){return head('Commander')+`<div class="conversation"><div class="chat-width"><div class="user-row"><div class="bubble">先把影響試用的重點告訴我。</div></div>${digest()}${s.sent.map(message=>`<div class="user-row sent-group">${message.context?`<div class="sent-context" data-digest-id="${esc(message.context.digestId)}" data-point-id="${esc(message.context.pointId)}"><small>回覆的摘要 · Commander 14:20</small><span>${esc(message.context.sentence)}</span></div>`:''}<div class="bubble" data-sent-message>${esc(message.words)}</div></div>`).join('')}</div></div><div class="mobile-gate">${namedGate()}</div>`+composer()}
function replay(){const p=points[s.point];const missing=s.modal==='missing';const sources=replaySources();const unique=[...new Map(sources.map((source,index)=>[source.fo,index])).entries()];return `<div class="modal-shade"><section class="replay-card ${s.longOriginal?'long':''}" role="dialog" aria-modal="true" aria-labelledby="replay-title"><div class="sheet-handle"></div><div class="modal-top"><h2 id="replay-title">Replay</h2><button class="close" data-action="close" aria-label="關閉 Replay">×</button></div><div class="replay-heading"><div class="replay-label">Commander 的這句話</div><p class="replay-sentence">${p.sentence}</p></div><div class="replay-scroll" tabindex="0" aria-label="FO 原文與來源">${missing?`<div class="source-meta"><b>${p.fo} · 引用資訊</b><span>今天 ${p.time}</span></div><div class="unavailable" role="status"><strong>找不到這段原文</strong><p>這則回報目前無法取回。你仍可開啟 FO 對話查看。</p></div>`:sources.map(source=>`<section class="source-block" data-source-id="${source.id}"><div class="source-meta"><b>${source.fo} · FO 原文</b><span>今天 ${source.time}</span></div><blockquote class="quote">「${esc(source.original)}」</blockquote></section>`).join('')}</div><div class="replay-actions">${s.choosingFo?`<div class="fo-picker">${unique.map(([name,index])=>`<button data-fo-source="${index}">${name} ↗</button>`).join('')}</div>`:''}<button class="action" data-action="open-fo">開啟 FO <span>↗</span></button><button class="action" data-action="discuss">繼續討論 <span>↩</span></button><button class="action primary" data-action="new-decision">回覆新決定 <span>↩</span></button></div></section></div>`}
function gate(){return head('關卡 · 試用 FO',true)+`<div class="detail-body"><div class="inner"><div class="eyebrow">關卡 · 驗證 · 預約流程</div><h1>${gateName}</h1><div class="gate-meta">試用 FO · 今天 14:18<br>決定目標：預約流程的試用驗證</div><section class="briefing"><h2>完整關卡說明</h2><h3>這次要決定</h3><p>是否讓範例團隊開始試用預約流程。這個決定只涵蓋試用，不包含正式上線。</p><h3>已提供的結果</h3><p>預約建立與取消的修正已完成；試用清單包含建立、改期及取消三個情境。</p><h3>仍需留意</h3><p>這是離線虛構說明，沒有真實試用結果。若要求修改或暫緩，請寫明原因再確認。</p></section></div></div><div class="gate-controls"><div class="inner">${s.gateSent?gateReceipt():`<div class="label">由 Commander 轉交這個關卡決定</div><div class="choices">${['准','要求修改','暫緩'].map((word,i)=>`<button class="choice ${i===0?'approve':i===1?'revise':''} ${s.chosen===word?'chosen':''}" data-choice="${word}" aria-pressed="${s.chosen===word}">${word}</button>`).join('')}</div>${s.chosen?`<label class="reason-label" for="reason">${s.chosen}的原因${s.chosen==='准'?'（可省略）':'（必填）'}</label><textarea id="reason" class="reason" placeholder="${s.chosen==='准'?'可補充條件或原因':'請寫明需要修改或暫緩的原因'}">${esc(s.reason)}</textarea><div class="confirm-row"><button id="confirm" class="confirm" data-action="confirm" ${s.chosen!=='准'&&!s.reason.trim()?'disabled':''}>Confirm ${s.chosen}</button><button class="cancel" data-action="cancel-choice">取消</button></div>`:''}`}</div></div>`}
function fo(){const p=s.foTarget||points[s.point];return head(p.fo,true)+`<div class="conversation"><div class="chat-width"><div class="byline">${p.fo} · 今天 ${p.time}</div><p style="font-size:15px;line-height:1.85;white-space:pre-wrap;margin:0">${esc(p.original)}</p></div></div>`+composer(true)}
function board(){return head('Board',true)+`<div class="board-mobile"><button class="commander-entry" data-action="home"><strong>◉ Commander</strong><small>方向與協調</small></button><div class="section-label">${s.gateSent?'決定進度':'待你決定'}</div>${namedGate()}<div class="section-label">工作進度</div><div class="fo-row">預約 FO<small>等安排試用</small></div><div class="fo-row">匯入 FO<small>欄位對照受阻</small></div><div class="fo-row">研究 FO<small>尚無可確認的新回報</small></div></div>`}
function render(focus){document.querySelector('#app').innerHTML=frame(s.view==='gate'?gate():s.view==='fo'?fo():s.view==='board'?board():commander())+(s.modal?replay():'');bind();if(focus)requestAnimationFrame(()=>document.querySelector(focus)?.focus())}
function bind(){document.querySelectorAll('[data-fo-source]').forEach(b=>b.onclick=()=>{s.foTarget=replaySources()[Number(b.dataset.foSource)];s.view='fo';s.modal=null;s.choosingFo=false;render('.back')});document.querySelectorAll('[data-replay]').forEach(b=>b.onclick=()=>{s.point=Number(b.dataset.replay);s.modal='replay';render('.close')});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(s.gateSent)return;s.chosen=b.dataset.choice;render(s.chosen==='准'?'#confirm':'#reason')});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));const input=document.querySelector('#message');if(input)input.oninput=()=>{s[s.view==='fo'?'foDraft':'draft']=input.value;document.querySelector('.send').disabled=!input.value.trim()};const reason=document.querySelector('#reason');if(reason)reason.oninput=()=>{s.reason=reason.value;document.querySelector('#confirm').disabled=s.chosen!=='准'&&!s.reason.trim()};document.querySelector('.modal-shade')?.addEventListener('click',e=>{if(e.target.classList.contains('modal-shade'))action('close')})}
function action(name){if(name==='close'){s.modal=null;s.choosingFo=false;render(`[data-replay="${s.point}"]`)}if(name==='home'){s.view='commander';s.modal=null;render()}if(name==='board'){s.view='board';s.modal=null;render()}if(name==='open-fo'){const sources=replaySources();if(new Set(sources.map(x=>x.fo)).size>1){s.choosingFo=!s.choosingFo;render('.fo-picker button')}else{s.foTarget=sources[0];s.view='fo';s.modal=null;render('.back')}}if(name==='discuss'||name==='new-decision'){s.context=s.point;s.modal=null;s.view='commander';render('#message')}if(name==='remove-context'){s.context=null;render('#message')}if(name==='gate'){s.view='gate';s.modal=null;render('.back')}if(name==='cancel-choice'&&!s.gateSent){s.chosen=null;s.reason='';render('[data-choice="准"]')}if(name==='confirm'&&!s.gateSent&&s.chosen&&(s.chosen==='准'||s.reason.trim())){s.gateSent=true;s.gateProgress='sent';s.confirmCount++;render('.back')}if(name==='send'){if(s.view==='fo'){if(!s.foDraft.trim())return;s.foDraft='';render('#message')}else{if(!s.draft.trim())return;s.sent.push({words:s.draft,context:s.context===null?null:contextFor(s.context)});s.draft='';s.context=null;render('#message');requestAnimationFrame(()=>{const x=document.querySelector('.conversation');x.scrollTop=x.scrollHeight})}}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.modal){e.preventDefault();action('close')}if(e.key==='Tab'&&s.modal){const buttons=[...document.querySelectorAll('.replay-card button')];const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function setScenario(id){Object.assign(s,{view:'commander',modal:null,point:2,context:null,draft:'',foDraft:'',sent:[],chosen:null,reason:'',gateSent:false,gateProgress:'unconfirmed',confirmCount:0,longOriginal:false,choosingFo:false,foTarget:null,scenario:id});if(id==='replay')s.modal='replay';if(id==='source-missing')s.modal='missing';if(id==='replay-long'||id==='replay-long-end'){s.modal='replay';s.longOriginal=true}if(id==='fo-chat')s.view='fo';if(id==='discuss'){s.context=2;s.draft='試用前還有哪個風險需要先處理？'}if(id==='direction-draft')s.draft='先完成試用安排，再處理其他改動。';if(id==='direction-sent')s.sent=[{words:'先完成試用安排，再處理其他改動。',context:null}];if(id==='context-sent')s.sent=[{words:'請先補齊取消預約的試用步驟。',context:contextFor(2)}];if(id==='decision-context')s.context=2;if(id.startsWith('gate-'))s.view='gate';if(id==='gate-confirm')s.chosen='准';if(id==='gate-reason-empty'||id==='gate-reason-ready')s.chosen='要求修改';if(id==='gate-reason-ready')s.reason='請先補齊取消預約的試用步驟。';if(['gate-sent','gate-relayed','gate-recorded'].includes(id)){s.chosen='准';s.gateSent=true;s.gateProgress=id.slice(5);s.confirmCount=1}render();if(['discuss','direction-draft','decision-context'].includes(id))document.querySelector('#message')?.focus();if(id==='gate-reason-ready')document.querySelector('#reason')?.focus();if(id==='context-sent'||id==='direction-sent')requestAnimationFrame(()=>{const panel=document.querySelector('.conversation');panel.scrollTop=panel.scrollHeight});if(id==='replay-long-end')requestAnimationFrame(()=>{const panel=document.querySelector('.replay-scroll');panel.scrollTop=panel.scrollHeight})}
window.mock={scenarios,setScenario,setGateProgress:progress=>{if(!s.gateSent||!gatePhases[progress])throw Error('Only an existing fictional decision can advance');s.gateProgress=progress;render()},snapshot:()=>JSON.parse(JSON.stringify(s))};setScenario(new URLSearchParams(location.search).get('state')||'digest');
</script></body></html>
