<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' file: data:; base-uri 'none'; form-action 'none'"><title>Commander 摘要 · 方向審查</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#121713;color:#e3ebe5}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer;color:inherit;background:none;border:0;min-height:44px}button:focus-visible,a:focus-visible{outline:2px solid #9fd8b2;outline-offset:3px}header{padding:24px 30px 22px;border-bottom:1px solid #2b352e}header small{font-size:11px;letter-spacing:.08em;color:#91b69d}h1{font-size:22px;font-weight:550;letter-spacing:-.3px;line-height:1.5;margin:10px 0 8px}header p{font-size:12px;color:#a5b0a8;margin:0;line-height:1.7}.layout{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 146px)}nav{border-right:1px solid #2b352e;padding:17px 12px}nav button{display:block;width:100%;text-align:left;border-radius:8px;padding:11px 12px;font-size:13px;margin-bottom:3px;line-height:1.5;color:#a9b5ac}nav button[aria-current=true]{background:#263b2b;color:#d6ebdd}nav button:hover{background:#1d2820}nav .index{color:#7f9587;font-size:11px;display:inline-block;width:24px}main{min-width:0;padding:22px 26px 40px}.tools{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}.tools h2{font-size:17px;margin:0 0 7px;font-weight:550}.tools p{font-size:12px;line-height:1.7;color:#a6b2aa;margin:0;max-width:600px}.toggles{display:flex;gap:4px;flex-shrink:0;border:1px solid #3b4b40;border-radius:9px;padding:3px}.toggles button{font-size:12px;padding:0 11px;min-height:36px;border-radius:6px;color:#a9b5ac}.toggles button[aria-pressed=true]{background:#334938;color:#e1eee5}.screens{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px;align-items:start}.screens.desktop{grid-template-columns:minmax(0,1fr)}.screens.phone{grid-template-columns:minmax(0,360px);justify-content:center}.screens.desktop .phone-card,.screens.phone .desktop-card{display:none}figure{margin:0;min-width:0}figcaption{font-size:11px;color:#9bada0;margin-bottom:9px;display:flex;justify-content:space-between}img{display:block;width:100%;height:auto;border:1px solid #354338;border-radius:9px;background:#1a211c}figure a{display:block}.foot{display:flex;justify-content:space-between;font-size:12px;color:#8b9e91;margin-top:19px;gap:16px}.foot a{color:#afd2ba;text-decoration:none}.foot a:hover{text-decoration:underline}@media(max-width:850px){header{padding:19px}h1{font-size:18px}.layout{grid-template-columns:185px minmax(0,1fr)}main{padding:18px}.screens{grid-template-columns:1fr}.phone-card{max-width:360px}.tools{flex-direction:column}nav{padding:12px 7px}nav button{font-size:12px;padding:10px 8px}}
</style></head><body><header><small>STEP B · 單一方向 · 全部資料虛構</small><h1>這版能讓你先讀方向，需要時再看原文與作決定嗎？</h1><p>只讀既有回報，缺資料標未知，不催問 FO。頻率、成本上限與實際啟用仍待確認。</p></header><div class="layout"><nav aria-label="審查狀態" id="states"></nav><main><div class="tools"><div><h2 id="state-title"></h2><p id="state-note"></p></div><div class="toggles" aria-label="截圖尺寸"><button data-size="both" aria-pressed="true">桌面＋手機</button><button data-size="desktop" aria-pressed="false">桌面</button><button data-size="phone" aria-pressed="false">手機</button></div></div><div class="screens both"><figure class="desktop-card"><figcaption><span>桌面 · 1440 × 1000</span><span>點圖看原尺寸</span></figcaption><a id="desktop-link" target="_blank"><img id="desktop-img" alt="桌面狀態截圖"></a></figure><figure class="phone-card"><figcaption><span>手機 · 360 × 780</span><span>點圖放大</span></figcaption><a id="phone-link" target="_blank"><img id="phone-img" alt="手機狀態截圖"></a></figure></div><div class="foot"><span>← → 切換狀態 · 本機靜態示意</span><a id="prototype-link" href="index.html" target="_blank">開啟這個狀態的操作示意 ↗</a></div></main></div><script id="review-scenarios" type="application/json">[{"id": "digest", "title": "先讀這輪摘要", "note": "三點由 Commander 改寫；研究 FO 沒有回報，明示未知。"}, {"id": "replay", "title": "看這句的原文", "note": "三行前因後果各有精確來源，原文留在同一 FO 的前後對話中。"}, {"id": "replay-long", "title": "長原文與多份來源", "note": "同一點的多份長來源各有自己的同 FO 對話範圍，三個出口固定。"}, {"id": "replay-long-end", "title": "長原文：捲到最後", "note": "捲到底仍可看原文所在對話、擴展前後及使用三個出口。"}, {"id": "replay-booking", "title": "預約這點的脈絡", "note": "只顯示預約 FO 的來源、脈絡與前後對話。"}, {"id": "replay-import", "title": "匯入這點的脈絡", "note": "只顯示匯入 FO 的來源；現在需要先確認日期欄位。"}, {"id": "replay-expanded", "title": "更早與更後的對話", "note": "擴展同一試用 FO 對話，沒有混入其他 FO 或猜測因果。"}, {"id": "source-missing", "title": "原文找不到", "note": "不拿相似文字補上，明示不可用；仍可開 FO。"}, {"id": "fo-chat", "title": "開啟 FO", "note": "只示意進入指定 FO 與返回 Commander，未測宿主。"}, {"id": "discuss", "title": "留在 Commander 討論", "note": "原句作可移除上下文，草稿未送出。"}, {"id": "context-sent", "title": "回覆後，引用仍保留", "note": "摘要點識別與原句隨訊息保留，與使用者自己的文字分開。"}, {"id": "direction-draft", "title": "一般方向：直接輸入", "note": "不開 Replay，輸入後按送出。"}, {"id": "direction-sent", "title": "一般方向：按送出後", "note": "虛構使用者訊息只代表本機示意；沒有關卡目標或記錄。"}, {"id": "decision-context", "title": "從原句回覆新決定", "note": "先回 Commander，尚未指定關卡；須另按具名入口。"}, {"id": "gate-briefing", "title": "按具名關卡，讀說明", "note": "目標為試用 FO／預約流程／驗證，不能由摘要來源推定。"}, {"id": "gate-confirm", "title": "選擇後，再次確認", "note": "選准仍未送出；須按 Confirm。"}, {"id": "gate-reason-empty", "title": "修改需要原因", "note": "尚未輸入原因，Confirm 不可用；暫緩同理。"}, {"id": "gate-reason-ready", "title": "填原因後，等待確認", "note": "原因屬這個具名關卡；尚未送出。"}, {"id": "gate-sent", "title": "確認後，尚未記錄", "note": "送出／轉交／已記錄保持分開，不畫成自動完成。"}, {"id": "gate-relayed", "title": "已轉交，尚未記錄", "note": "具名入口與重新開啟的詳情保留相同決定及進度。"}, {"id": "gate-recorded", "title": "已記錄，重開不重送", "note": "保留原決定，沒有第二個 Confirm；不代表工作已全部完成。"}]</script><script>
const states=JSON.parse(document.querySelector('#review-scenarios').textContent);let current=0;let size='both';function show(i){current=(i+states.length)%states.length;const state=states[current];document.querySelector('#states').innerHTML=states.map((item,index)=>`<button data-index="${index}" aria-current="${index===current}"><span class="index">${String(index+1).padStart(2,'0')}</span>${item.title}</button>`).join('');document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>show(Number(b.dataset.index)));document.querySelector('#state-title').textContent=state.title;document.querySelector('#state-note').textContent=state.note;for(const [name,width] of [['desktop',1440],['phone',360]]){const file=`screenshots/${width}-${state.id}.png`;document.querySelector('#'+name+'-img').src=file;document.querySelector('#'+name+'-img').alt=state.title+' · '+width;document.querySelector('#'+name+'-link').href=file}document.querySelector('#prototype-link').href='index.html?state='+state.id}document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{size=b.dataset.size;document.querySelector('.screens').className='screens '+size;document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();show(current+(e.key==='ArrowRight'?1:-1))}});window.review={states,get current(){return states[current].id},get size(){return size},show};show(0);
</script></body></html>
