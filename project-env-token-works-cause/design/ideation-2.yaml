design_review:
  preview: project-env-token-works-cause/design/preview-desktop-dark-4-ok-three-vaults.png
  findings:
    - severity: MAJOR
      dimension: flow
      where: preview-desktop-dark-12-ok-no-vault.png and preview-desktop-dark-13-chosen-vault-not-readable.png
      seen: The Vault control reads "relay-dev (this token cannot read it)" but the "Browse vault" button beside "Pick fields from the vault" is drawn bright and enabled, while in pictures 4 and 6-11 it is dimmed.
      fix: Draw "Browse vault" disabled whenever the chosen vault is not in the readable list, and say why in its help line.
    - severity: MAJOR
      dimension: hierarchy
      where: preview-desktop-dark-13-chosen-vault-not-readable.png
      seen: The status line still reads "Token works / Can read 2 vaults: relay-prod, personal" in plain text, and the only warning is a parenthetical inside the closed Vault control, with no error colour, no icon and no next-step line.
      fix: Give the Vault row its own error styling and a one-line fix ("Pick relay-prod or personal"), or carry the problem into the status line.
    - severity: MINOR
      dimension: hierarchy
      where: preview-desktop-dark-4 against 7, 8, 9, 10 and 11
      seen: The success headline "Token works" and every failure headline use the same plain white label weight, with no icon or colour, so a failure reads like a field label and success is not visually distinct from failure.
      fix: Add a small status icon or colour to the headline (success, warning, error) and keep the next-step line in muted text.
    - severity: MINOR
      dimension: hierarchy
      where: preview-desktop-dark-2-not-checked.png, preview-desktop-dark-4-ok-three-vaults.png
      seen: Picture 2 repeats the account name already shown in the input above ("Not checked for relay-dev-read yet") and adds "Press Check." beside a Check button. Picture 4 gives the count and the list ("Can read 3 vaults: relay-dev, relay-prod, personal").
      fix: Drop the repeated name, the "Press Check." line and the count, and keep the list only.
    - severity: MINOR
      dimension: states
      where: preview-desktop-dark-11-unexpected.png
      seen: The "unrecognised" row has no next-step line, though the proposal calls for a fixed one beneath every status. It is a single long sentence, and the row is 4px shorter than the others, so everything below shifts up.
      fix: Add a fixed next-step line (for example "Check again; if it persists, run op in a terminal") and use the same row height.
    - severity: MINOR
      dimension: states
      where: set as a whole
      seen: The proposal lists a "truncated" cause but no preview shows it. No picture shows a long vault list or a long account name in the status line, a Check that times out or hangs, the state after Save token, or an open Vault menu of unreadable or zero options (picture 12 shows a dropdown with nothing to offer).
      fix: Add previews for truncated, a long vault list (wrap or "+N more"), a long account name, and a Check timeout with a way out.
    - severity: MINOR
      dimension: states
      where: preview-desktop-dark-1-no-account.png, -2-not-checked.png, -3-checking.png, preview-desktop-light-locked.png, preview-compact-dark-locked.png
      seen: The Vault field is an empty plain box with no placeholder, no chevron and no reason it is empty, so it is unclear if it is disabled or editable. In the failure states 6-11 the same row is a text input holding "relay-dev", and the locked fixture differs between pictures (Vault empty in the light and compact pictures, "relay-dev" in dark picture 7).
      fix: Give the empty Vault a placeholder or disabled style ("Check the token first") and use one fixture across the sizes and themes.
    - severity: MINOR
      dimension: flow
      where: preview-desktop-dark-5-ok-one-vault-picked.png
      seen: The Vault field shows "relay-dev" with no cue that Check chose it automatically, and no sign of whether it is saved.
      fix: Add a short cue ("Chosen automatically: only vault this token can read") that clears once the person changes it.
    - severity: MINOR
      dimension: flow
      where: preview-desktop-dark-2-not-checked.png and -3-checking.png
      seen: Once the account name is edited, the Vault drops to an empty box, while in failure states (6-11) the chosen vault stays. The previews do not say whether the old choice is kept or cleared, and the Vault row has no help line saying what the choice scopes, unlike its neighbours.
      fix: Keep the previous vault visible (marked "not checked") until Check runs, and add a one-line help text on the Vault row naming its scope.
    - severity: MINOR
      dimension: flow
      where: preview-desktop-dark-6-no-token.png
      seen: The headline says "Paste it below and save it", but the bright, enabled button on the row is Check, while the Save token button two rows down is the dim one the person needs.
      fix: Disable Check in the no-token state, or show how a pasted token enables Save token and triggers a re-check.
    - severity: MINOR
      dimension: spacing
      where: preview-desktop-dark-3-checking.png
      seen: The Check button turns into a wider "Checking..." button (about 97px against about 67px) with no spinner, so the control changes width.
      fix: Keep the button width fixed and show a spinner instead of changing the label length.
    - severity: MINOR
      dimension: platform
      where: preview-compact-dark-ok-three-vaults.png, preview-compact-dark-locked.png
      seen: Check, Choose... and Save token are about 30-32px tall, below the usual 44px touch target for a phone-width layout.
      fix: Raise the compact button and select height to at least 44px, or confirm the host's own control height is the accepted baseline.
    - severity: MINOR
      dimension: theme-size
      where: set as a whole
      seen: Light is shown only for locked and ok-three-vaults, and compact only for dark ok-three-vaults and locked. Light is missing for states 1-3, 5-6, 8-13; compact is missing the failure states, picture 13 (a Vault control about 280px wide) and picture 12.
      fix: Add light and compact previews for at least the "ok-no-vault", "chosen-vault-not-readable" and "unexpected" states, and check the long Vault label fits at 430px.
  limitations:
    - "Pass 1 inventory, desktop main picture 4: blocks above the token row are the host title, a Back to plugins link, a section label (relay), then the Main checkout row (about 70px) and the 1Password service account row, so the token row starts at about y=363 of 1100 (about 33%). Controls, all text buttons or inputs of about 32px height: Check (about 67px wide), Choose... (select with down chevron, about 78px), the service account input (about 180px), the token input ops_..., Save token (dimmed, about 97px), Add (dimmed), Browse vault (dimmed in 4), Import. Compact picture 4: the same controls, with inputs stacked under their labels (about 188px wide) and Check about 67px."
    - The open dropdown of the Vault select is not shown in any picture, so I could not check whether the offered list matches the proposal or how an unreadable chosen vault appears in it.
    - Contrast ratios and exact pixel sizes were estimated by eye, not measured, and focus, hover and keyboard states are not drawn except the focused input in picture 2.
